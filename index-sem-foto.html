<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0e2a47"><link rel="manifest" href="/manifest.webmanifest"><title>IEADJO Nova Joinville</title><style> :root{--navy:#0e2a47;--blue:#174f7c;--gold:#d5ad58;--bg:#f5f7fa;--card:#fff;--text:#152433;--muted:#6c7a89;--line:#e5eaf0;--green:#238b57}*{box-sizing:border-box}body{margin:0;background:#e9eef3;color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.app{max-width:520px;min-height:100vh;margin:auto;background:var(--bg);padding-bottom:88px}.top{height:74px;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,var(--navy),#153b60);color:white;position:sticky;top:0;z-index:5}.brand{display:flex;gap:10px;align-items:center}.mark{width:42px;height:42px;border:1px solid #ffffff55;border-radius:13px;display:grid;place-items:center;font-weight:800;color:var(--gold)}.brand div:last-child{display:flex;flex-direction:column}.brand strong{letter-spacing:1px;font-size:18px}.brand small{letter-spacing:1.7px;opacity:.8;font-size:10px}.avatar{width:38px;height:38px;border:0;border-radius:50%;background:var(--gold);font-weight:800;color:var(--navy)}main{padding:20px 16px}.hello p{margin:0;color:var(--blue);font-weight:700}.hello h1{margin:4px 0 2px;font-size:25px}.hello span,.muted{font-size:13px;color:var(--muted)}.hero{margin-top:18px;background:linear-gradient(145deg,var(--navy),#17496f);color:#fff;border-radius:22px;padding:18px;box-shadow:0 12px 30px #0e2a4722}.herohead{display:flex;justify-content:space-between;font-size:12px;opacity:.9}.pill{display:inline-block;background:#d5ad5826;color:#f3d38b;border:1px solid #d5ad5860;border-radius:99px;padding:5px 9px;font-size:10px;font-weight:800}.hero h2{margin:14px 0 3px}.hero .muted{color:#ffffffaa}.role{display:flex;gap:10px;align-items:center;margin:16px 0;background:#ffffff10;padding:11px;border-radius:14px}.role span{font-size:23px}.role small,.role b{display:block}.actions{display:flex;gap:8px}.actions button{flex:1;border:0;border-radius:12px;padding:11px 8px;font-weight:750}.primary{background:var(--gold);color:var(--navy)}.success{background:#54c388;color:#073c24}.secondary{background:#ffffff14;color:white;border:1px solid #ffffff25!important}.section-title{margin:22px 2px 10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid button{background:white;border:1px solid var(--line);border-radius:16px;padding:15px;text-align:left;display:grid;grid-template-columns:36px 1fr;grid-template-rows:auto auto}.grid button .ico{grid-row:1/3;font-size:22px}.grid b{font-size:14px}.grid small{color:var(--muted);margin-top:2px}.notice,.card,.song,.setting{background:white;border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:10px}.notice{display:flex;gap:12px;background:#fff8e8;border-color:#f1dcaa}.notice p{font-size:12px;color:#6f6042;line-height:1.45;margin:3px 0}.pagehead h1{margin:0;font-size:25px}.pagehead p{margin:4px 0 18px;color:var(--muted);font-size:13px}.card,.song,.setting{display:flex;gap:12px;align-items:center}.date{width:48px;height:50px;border-radius:12px;background:#eef4f9;color:var(--blue);display:flex;flex-direction:column;justify-content:center;align-items:center;font-weight:800}.date small{font-size:10px}.grow{flex:1;display:flex;flex-direction:column}.grow b{font-size:14px}.grow span{font-size:12px;color:var(--muted)}.status{font-size:10px;padding:6px 8px;border-radius:99px;background:#fff4df;color:#9a6913}.status.ok{background:#e7f7ef;color:#26764d}.calendar{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px}.calhead{display:flex;justify-content:space-between;padding-bottom:15px}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.week span{font-size:10px;color:var(--muted)}.days span{aspect-ratio:1;display:grid;place-items:center;font-size:12px;border-radius:50%}.days .event{background:var(--navy);color:#fff;box-shadow:inset 0 -3px var(--gold)}.song .icon{width:42px;height:42px;border-radius:12px;background:#eef4f9;display:grid;place-items:center;font-size:22px;color:var(--blue)}.song button,.admin button,.composer button{border:0;border-radius:10px;background:var(--navy);color:#fff;padding:9px 11px;font-size:11px;font-weight:700}.post{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px;margin-bottom:12px}.post h3{margin:10px 0 7px}.post p{font-size:13px;color:#566675;line-height:1.55}.chat{min-height:400px}.bubble{max-width:86%;background:#fff;border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:10px 12px;margin-bottom:10px}.bubble.mine{margin-left:auto;background:#e6f0f8;border-radius:16px 16px 4px 16px}.bubble b{font-size:11px;color:var(--blue)}.bubble p{margin:4px 0;font-size:13px}.bubble small{display:block;text-align:right;color:var(--muted);font-size:9px}.composer{display:flex;gap:8px;position:sticky;bottom:74px;background:var(--bg);padding:10px 0}.composer input{flex:1;border:1px solid var(--line);border-radius:12px;padding:12px}.profile{text-align:center;padding:14px}.bigavatar{width:72px;height:72px;margin:auto;background:var(--gold);border-radius:50%;display:grid;place-items:center;font-size:26px;font-weight:800;color:var(--navy)}.setting{justify-content:space-between}.setting div{display:flex;flex-direction:column}.setting span{font-size:11px;color:var(--muted)}.toggle{width:44px;height:25px;border:0;border-radius:99px;background:#cbd4dc;padding:3px}.toggle i{display:block;width:19px;height:19px;border-radius:50%;background:white;transition:.2s}.toggle.on{background:var(--green)}.toggle.on i{transform:translateX(19px)}.admin{background:#fff7e8;border:1px solid #ead8ae;border-radius:18px;padding:16px;margin-top:12px}.admin p{font-size:12px;color:#766548}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:72px;background:#fff;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);z-index:10}.nav button{border:0;background:none;color:#8b98a5;display:flex;flex-direction:column;align-items:center;justify-content:center}.nav button span{font-size:21px}.nav button small{font-size:10px}.nav button.active{color:var(--navy);font-weight:800}.hidden{display:none!important}@media(min-width:700px){.app{margin-top:20px;min-height:calc(100vh - 40px);border-radius:24px;overflow:hidden}.nav{bottom:20px;border-radius:0 0 24px 24px}} </style></head><body><div class="app"><header class="top"><div class="brand"><div class="mark">IE</div><div><strong>IEADJO</strong><small>NOVA JOINVILLE</small></div></div><button class="avatar" data-go="perfil">F</button></header><main id="view"></main><nav class="nav"><button data-go="inicio" class="active"><span>⌂</span><small>Início</small></button><button data-go="escalas"><span>☷</span><small>Escalas</small></button><button data-go="calendario"><span>□</span><small>Agenda</small></button><button data-go="chat"><span>◌</span><small>Chat</small></button><button data-go="perfil"><span>♙</span><small>Perfil</small></button></nav></div><script> const schedules=[['23','AGO','Culto de Celebração','19:00 • Bateria','Confirmado'],['26','AGO','Ensaio do Louvor','20:00 • Equipe completa','Pendente'],['30','AGO','Culto da Família','19:00 • Bateria','Pendente']];const songs=[['Bondade de Deus','G','Domingo'],['Lugar Secreto','D','Domingo'],['A Casa É Sua','E','Domingo'],['Me Atraiu','A','Ensaio']];let confirmed=localStorage.getItem('confirmed')==='1';let available=localStorage.getItem('available')!=='0';let messages=JSON.parse(localStorage.getItem('chat')||'null')||[{name:'Pr. Lucas',msg:'Pessoal, ensaio quarta às 20h. Deus abençoe!',time:'11:42'},{name:'Mariana',msg:'Confirmado 🙏',time:'11:50'}];let tab='inicio';const view=document.querySelector('#view'); function page(title,sub,body){return `<div class="pagehead"><h1>${title}</h1><p>${sub}</p></div>${body}`} function render(){document.querySelectorAll('[data-go]').forEach(b=>b.classList.toggle('active',b.dataset.go===tab));if(tab==='inicio')view.innerHTML=`<div class="hello"><p>Boa tarde, Fabio 👋</p><h1>Ministério de Louvor</h1><span>Organização, comunhão e serviço em um só lugar.</span></div><div class="hero"><div class="herohead"><span class="pill">PRÓXIMA ESCALA</span><span>Dom • 23 ago</span></div><h2>Culto de Celebração</h2><p class="muted">19:00 • Templo IEADJO Nova Joinville</p><div class="role"><span>🥁</span><div><small>Sua função</small><b>Baterista</b></div></div><div class="actions"><button id="confirm" class="${confirmed?'success':'primary'}">${confirmed?'✓ Presença confirmada':'Confirmar presença'}</button><button class="secondary" id="cant">Não posso ir</button></div></div><div class="section-title"><h3>Acesso rápido</h3></div><div class="grid">${[['📋','Escalas','3 próximas','escalas'],['📅','Calendário','Agosto 2026','calendario'],['🎵','Repertório','4 músicas','repertorio'],['📢','Avisos','2 novos','avisos'],['💬','Chat geral','Todos','chat'],['👤','Meu perfil','Disponibilidade','perfil']].map(x=>`<button data-go="${x[3]}"><span class="ico">${x[0]}</span><b>${x[1]}</b><small>${x[2]}</small></button>`).join('')}</div><div class="notice"><div>📌</div><div><b>Aviso da liderança</b><p>Ensaio geral nesta quarta-feira às 20h. Chegar 15 minutos antes.</p></div></div>`; if(tab==='escalas')view.innerHTML=page('Minhas escalas','Confirme sua participação e veja suas funções.',schedules.map(s=>`<div class="card"><div class="date">${s[0]}<small>${s[1]}</small></div><div class="grow"><b>${s[2]}</b><span>${s[3]}</span></div><span class="status ${s[4]==='Confirmado'?'ok':''}">${s[4]}</span></div>`).join('')); if(tab==='calendario'){let ds='';for(let i=0;i<35;i++){let d=i-5;ds+=`<span class="${[23,26,30].includes(d)?'event':''}">${d>0&&d<=31?d:''}</span>`}view.innerHTML=page('Calendário','Cultos, ensaios e eventos do ministério.',`<div class="calendar"><div class="calhead"><b>Agosto 2026</b><span>‹ &nbsp; ›</span></div><div class="week"><span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span></div><div class="days">${ds}</div></div>`)} if(tab==='repertorio')view.innerHTML=page('Repertório','Músicas da semana, tons e materiais.',songs.map(s=>`<div class="song"><div class="icon">♫</div><div class="grow"><b>${s[0]}</b><span>Tom: ${s[1]} • ${s[2]}</span></div><button>Ver cifra</button></div>`).join('')); if(tab==='avisos')view.innerHTML=page('Mural de avisos','Comunicados oficiais da liderança.',`<article class="post"><span class="pill">IMPORTANTE</span><h3>Ensaio geral — quarta-feira</h3><p>Começaremos às 20h. Pedimos que todos cheguem 15 minutos antes para organização dos instrumentos e passagem de som.</p><small>Hoje • Liderança do Louvor</small></article><article class="post"><h3>Repertório de domingo atualizado</h3><p>As músicas e os tons já estão disponíveis na área de repertório.</p><small>Ontem • Ministério de Louvor</small></article>`); if(tab==='chat')view.innerHTML=page('Chat geral','Espaço de conversa para todos os integrantes.',`<div class="chat">${messages.map(m=>`<div class="bubble ${m.name==='Você'?'mine':''}"><b>${m.name}</b><p>${m.msg}</p><small>${m.time}</small></div>`).join('')}</div><div class="composer"><input id="msg" placeholder="Escreva uma mensagem..."><button id="send">Enviar</button></div>`); if(tab==='perfil')view.innerHTML=page('Meu perfil','Dados pessoais e disponibilidade.',`<div class="profile"><div class="bigavatar">F</div><h2>Fabio</h2><p>Integrante • Baterista</p></div><div class="setting"><div><b>Disponível para escalas</b><span>Você pode alterar quando precisar.</span></div><button id="toggle" class="toggle ${available?'on':''}"><i></i></button></div><div class="setting"><div><b>Funções</b><span>Baterista</span></div><button style="border:0;background:none;color:#174f7c;font-weight:700">Editar</button></div><div class="admin"><b>Área da liderança</b><p>Gerenciar escalas, integrantes, repertório e avisos.</p><button>Entrar no painel administrativo</button></div>`); bind()} function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{tab=b.dataset.go;render()});let c=document.querySelector('#confirm');if(c)c.onclick=()=>{confirmed=true;localStorage.setItem('confirmed','1');render()};let no=document.querySelector('#cant');if(no)no.onclick=()=>{available=false;localStorage.setItem('available','0');tab='perfil';render()};let t=document.querySelector('#toggle');if(t)t.onclick=()=>{available=!available;localStorage.setItem('available',available?'1':'0');render()};let s=document.querySelector('#send'),i=document.querySelector('#msg');if(s)s.onclick=()=>{if(i.value.trim()){messages.push({name:'Você',msg:i.value.trim(),time:'Agora'});localStorage.setItem('chat',JSON.stringify(messages));render()}}} render();if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js'); </script></body></html>
