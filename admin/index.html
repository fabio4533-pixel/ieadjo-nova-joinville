<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0e2a47"><title>IEADJO • Painel da Liderança</title><style>
:root{--navy:#0e2a47;--gold:#d5ad58;--bg:#f4f7fa;--text:#152433;--muted:#6b7885;--line:#dfe6ec;--green:#238b57;--red:#b93838}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(180deg,#0e2a47 0,#163c60 280px,#f4f7fa 280px);color:var(--text);min-height:100vh}.wrap{max-width:1000px;margin:auto;padding:24px 16px 50px}.top,.dashhead{display:flex;align-items:center;justify-content:space-between;gap:12px;color:#fff;margin-bottom:20px}.top .brand{display:flex;align-items:center;gap:12px}.top img{width:54px;height:54px;border-radius:16px;object-fit:cover;border:2px solid #fff6}.top h1,.dashhead h2{margin:0}.top p,.dashhead small{margin:3px 0 0;font-size:12px;opacity:.8}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 12px 35px #0e2a4720}.auth{max-width:430px;margin:36px auto}.field{margin-top:13px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input,.field textarea,.field select,.inline input,.inline select{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px;background:#fff}.row,.inline{display:flex;gap:8px;margin-top:12px}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:800;cursor:pointer}.primary{background:var(--navy);color:#fff}.ghost{background:#edf2f6;color:var(--navy)}.danger{background:#fff0f0;color:var(--red)}.successbtn{background:#e8f7ef;color:#206b47}.msg{font-size:12px;margin-top:10px;min-height:18px}.ok{color:var(--green)}.err{color:var(--red)}.hidden{display:none!important}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.tile{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px;cursor:pointer;text-align:left}.tile.active{box-shadow:0 8px 22px #0e2a4722;border-color:#9fb1c1}.tile span{font-size:25px}.tile b{display:block;margin-top:8px}.tile small,.item small{color:var(--muted)}.section{margin-top:14px}.section h3{margin:0 0 5px}.section>p{margin:0 0 14px;color:var(--muted);font-size:13px}.list{margin-top:12px}.item{display:flex;justify-content:space-between;gap:12px;align-items:center;border-top:1px solid var(--line);padding:12px 0}.item:first-child{border-top:0}.item b{display:block}.leaderform{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}.leaderform input{border:1px solid var(--line);border-radius:11px;padding:12px}.back{color:#fff;text-decoration:none;font-size:12px;font-weight:800}.security{margin-top:14px;background:#eef6f1;border:1px solid #cce3d4;border-radius:14px;padding:12px;font-size:12px;color:#2c6848}.daytag,.statusTag{display:inline-block;margin-top:5px;padding:4px 8px;border-radius:99px;background:#eef4f9;color:#174f7c;font-size:10px;font-weight:800}.statusTag.okay{background:#e8f7ef;color:#206b47}.statusTag.blocked{background:#fff0f0;color:#a12e2e}.actions{display:flex;gap:7px;flex-wrap:wrap}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:720px){.leaderform,.inline{display:grid;grid-template-columns:1fr}.dashhead,.top{align-items:flex-start;flex-direction:column}}@media(max-width:420px){.grid{grid-template-columns:1fr}.item{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="wrap"><div class="top"><div class="brand"><img src="/igreja-hq.jpg" alt="IEADJO"><div><h1>IEADJO Nova Joinville</h1><p>Painel administrativo da liderança</p></div></div></div>
<section id="auth" class="card auth"><h2>Acesso restrito</h2><p>Somente líderes autorizados conseguem entrar.</p><div class="field"><label>E-mail</label><input id="email" type="email"></div><div class="field"><label>Senha</label><input id="password" type="password"></div><div class="row"><button id="login" class="btn primary">Entrar</button><button id="signup" class="btn ghost">Primeiro acesso</button></div><div id="authMsg" class="msg"></div><div class="security">🔒 A conta também precisa estar na lista oficial de líderes.</div></section>
<section id="dashboard" class="hidden"><div class="dashhead"><div><h2>Painel da Liderança</h2><small id="who"></small></div><div><a class="back" href="/">← Voltar</a> &nbsp; <button id="logout" class="btn ghost">Sair</button></div></div><div class="grid"><button class="tile" data-sec="schedules"><span>📋</span><b>Escalas</b><small>Organizar cultos e funções</small></button><button class="tile" data-sec="members"><span>👥</span><b>Integrantes</b><small>Equipe e disponibilidade</small></button><button class="tile" data-sec="access"><span>🔐</span><b>Acessos</b><small>Liberar login por nome e e-mail</small></button><button class="tile" data-sec="songs"><span>🎵</span><b>Repertório</b><small>Terça, quinta, sábado e domingo</small></button><button class="tile" data-sec="notices"><span>📢</span><b>Avisos</b><small>Comunicados da liderança</small></button></div><div id="work" class="card section"><h3>Escolha uma área acima</h3></div><div class="card section"><h3>Líderes autorizados</h3><div class="leaderform"><input id="leaderName" placeholder="Nome"><input id="leaderEmail" type="email" placeholder="E-mail"><button id="addLeader" class="btn primary">Adicionar</button></div><div id="leaderMsg" class="msg"></div><div id="leaders" class="list"></div></div></section></div>
<script>
const U='https://fzpffyouubmbxfwycywg.supabase.co',K='sb_publishable_fqG3I5cRWBXjn-EP0FoATA_0-SWvfsR';const auth=document.getElementById('auth'),dash=document.getElementById('dashboard'),authMsg=document.getElementById('authMsg'),leaderMsg=document.getElementById('leaderMsg'),work=document.getElementById('work');function S(){try{return JSON.parse(localStorage.getItem('ieadjo_admin_session')||'null')}catch{return null}}function save(x){localStorage.setItem('ieadjo_admin_session',JSON.stringify(x))}function clear(){localStorage.removeItem('ieadjo_admin_session')}function msg(el,t,ok=false){el.textContent=t;el.className='msg '+(ok?'ok':'err')}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}async function req(path,o={}){const s=S(),h={'apikey':K,'Content-Type':'application/json',...(o.headers||{})};if(s?.access_token)h.Authorization='Bearer '+s.access_token;const r=await fetch(U+path,{...o,headers:h});let d=null;try{d=await r.json()}catch{}if(!r.ok)throw new Error(d?.message||d?.msg||d?.error_description||'Erro');return d}async function verify(){try{return !!(await req('/rest/v1/ieadjo_leaders?select=email&limit=1')).length}catch{return false}}async function enter(){if(await verify()){auth.classList.add('hidden');dash.classList.remove('hidden');who.textContent=S()?.user?.email||'';loadLeaders()}else{clear();dash.classList.add('hidden');auth.classList.remove('hidden')}}async function login(){try{msg(authMsg,'Verificando...',true);const d=await req('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:email.value.trim(),password:password.value})});save(d);if(!(await verify())){clear();throw new Error('Este e-mail não está autorizado como líder.')}enter()}catch(e){msg(authMsg,e.message)}}async function signup(){try{if(password.value.length<6)throw new Error('Use uma senha com pelo menos 6 caracteres.');const d=await req('/auth/v1/signup',{method:'POST',body:JSON.stringify({email:email.value.trim(),password:password.value})});if(d.access_token){save(d);enter()}else msg(authMsg,'Conta criada. Confirme o e-mail e depois entre.',true)}catch(e){msg(authMsg,e.message)}}async function loadLeaders(){try{const rows=await req('/rest/v1/ieadjo_leaders?select=email,display_name,created_at&order=created_at.asc');leaders.innerHTML=rows.map(r=>`<div class="item"><div><b>${esc(r.display_name||'Líder')}</b><small>${esc(r.email)}</small></div><button class="btn danger" data-rm="${encodeURIComponent(r.email)}">Remover</button></div>`).join('');leaders.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>removeLeader(decodeURIComponent(b.dataset.rm)))}catch(e){msg(leaderMsg,e.message)}}async function addLeader(){try{await req('/rest/v1/ieadjo_leaders',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({email:leaderEmail.value.trim().toLowerCase(),display_name:leaderName.value.trim()||null})});leaderEmail.value='';leaderName.value='';msg(leaderMsg,'Líder autorizado.',true);loadLeaders()}catch(e){msg(leaderMsg,e.message)}}async function removeLeader(e){await req('/rest/v1/ieadjo_leaders?email=eq.'+encodeURIComponent(e),{method:'DELETE'});loadLeaders()}
const conf={schedules:{title:'Escalas',table:'ieadjo_schedules',fields:[['event_date','Data','date'],['title','Evento','text'],['time_text','Horário','text'],['role_text','Função','text']]},members:{title:'Integrantes',table:'ieadjo_members',fields:[['name','Nome','text'],['role_text','Função','text'],['email','E-mail','email']]},notices:{title:'Avisos',table:'ieadjo_notices',fields:[['title','Título','text'],['body','Aviso','text']]}};
async function openSec(key){document.querySelectorAll('.tile').forEach(x=>x.classList.toggle('active',x.dataset.sec===key));if(key==='songs')return openSongs();if(key==='access')return openAccess();const c=conf[key];work.innerHTML=`<h3>${c.title}</h3><p>Adicione, visualize e remova registros.</p><div class="inline">${c.fields.map(f=>`<input id="f_${f[0]}" type="${f[2]}" placeholder="${f[1]}">`).join('')}<button id="saveItem" class="btn primary">Adicionar</button></div><div id="secMsg" class="msg"></div><div id="items" class="list"></div>`;saveItem.onclick=()=>addItem(key);loadItems(key)}async function addItem(key){const c=conf[key],obj={};c.fields.forEach(f=>obj[f[0]]=document.getElementById('f_'+f[0]).value.trim());try{await req('/rest/v1/'+c.table,{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(obj)});msg(secMsg,'Salvo com sucesso.',true);loadItems(key)}catch(e){msg(secMsg,e.message)}}async function loadItems(key){const c=conf[key];try{const rows=await req('/rest/v1/'+c.table+'?select=*&order=created_at.desc');items.innerHTML=rows.map(r=>`<div class="item"><div><b>${esc(r.title||r.name||r.event_date)}</b><small>${esc([r.event_date,r.time_text,r.role_text,r.email,r.body].filter(Boolean).join(' • '))}</small></div><button class="btn danger" data-id="${r.id}">Remover</button></div>`).join('')||'<small>Nenhum registro.</small>';items.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>delItem(key,b.dataset.id))}catch(e){msg(secMsg,e.message)}}async function delItem(key,id){await req('/rest/v1/'+conf[key].table+'?id=eq.'+id,{method:'DELETE'});loadItems(key)}
async function openAccess(){work.innerHTML=`<h3>🔐 Acesso dos integrantes</h3><p>Cadastre o nome e o e-mail do integrante. O e-mail será o login. Somente quem estiver com acesso liberado poderá entrar no aplicativo.</p><div class="inline"><input id="accessName" placeholder="Nome do integrante"><input id="accessEmail" type="email" placeholder="E-mail / login"><button id="grantAccess" class="btn primary">Liberar acesso</button></div><div id="secMsg" class="msg"></div><div id="items" class="list"></div>`;grantAccess.onclick=grantMemberAccess;loadAccessList()}
async function grantMemberAccess(){const name=accessName.value.trim(),email=accessEmail.value.trim().toLowerCase();if(!name||!email)return msg(secMsg,'Informe o nome e o e-mail do integrante.');try{const found=await req('/rest/v1/ieadjo_members?select=id,user_id&email=ilike.'+encodeURIComponent(email)+'&limit=1');if(found.length){await req('/rest/v1/ieadjo_members?id=eq.'+found[0].id,{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({name,email,approved:true})})}else{await req('/rest/v1/ieadjo_members',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({name,email,approved:true,available:true})})}accessName.value='';accessEmail.value='';msg(secMsg,'Acesso liberado com sucesso.',true);loadAccessList()}catch(e){msg(secMsg,e.message)}}
async function setMemberAccess(id,approved){try{await req('/rest/v1/ieadjo_members?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({approved})});loadAccessList()}catch(e){msg(secMsg,e.message)}}
async function loadAccessList(){try{const rows=await req('/rest/v1/ieadjo_members?select=id,name,email,approved,user_id,role_text&order=created_at.desc');items.innerHTML=rows.map(r=>`<div class="item"><div><b>${esc(r.name||'Integrante')}</b><small>${esc(r.email||'Sem e-mail')}</small><br><span class="statusTag ${r.approved?'okay':'blocked'}">${r.approved?'ACESSO LIBERADO':'BLOQUEADO'}</span>${r.user_id?'<span class="statusTag"> CADASTRO CRIADO</span>':'<span class="statusTag"> AGUARDANDO CADASTRO</span>'}</div><div class="actions">${r.approved?`<button class="btn danger" data-block="${r.id}">Bloquear</button>`:`<button class="btn successbtn" data-allow="${r.id}">Liberar</button>`}</div></div>`).join('')||'<small>Nenhum integrante cadastrado.</small>';items.querySelectorAll('[data-block]').forEach(b=>b.onclick=()=>setMemberAccess(b.dataset.block,false));items.querySelectorAll('[data-allow]').forEach(b=>b.onclick=()=>setMemberAccess(b.dataset.allow,true))}catch(e){msg(secMsg,e.message)}}
function dayLabel(v){return ({terca:'TERÇA • DOUTRINA',quinta:'QUINTA • VITÓRIA',sabado:'SÁBADO',domingo:'DOMINGO'})[v]||String(v||'').toUpperCase()}
async function openSongs(){let schedules=[];try{schedules=await req('/rest/v1/ieadjo_schedules?select=id,event_date,title&order=event_date.asc')}catch{}const opts=schedules.map(s=>`<option value="${s.id}">${esc(s.event_date)} — ${esc(s.title)}</option>`).join('');work.innerHTML=`<h3>Repertório por culto</h3><p>Escolha o culto correspondente: Doutrina na terça, Vitória na quinta, culto de sábado ou culto de domingo. Você também pode vincular a música a uma data específica do calendário.</p><div class="inline"><input id="songTitle" placeholder="Música"><input id="songKey" placeholder="Tom"><select id="songDay"><option value="terca">Terça-feira — Culto de Doutrina</option><option value="quinta">Quinta-feira — Culto da Vitória</option><option value="sabado">Sábado — Culto</option><option value="domingo">Domingo — Culto</option></select><select id="songSchedule"><option value="">Todos os cultos desse tipo</option>${opts}</select><input id="songNotes" placeholder="Observações"><button id="saveSong" class="btn primary">Adicionar</button></div><div id="secMsg" class="msg"></div><div id="items" class="list"></div>`;saveSong.onclick=addSong;loadSongs()}
async function addSong(){try{const obj={title:songTitle.value.trim(),song_key:songKey.value.trim(),service_day:songDay.value,schedule_id:songSchedule.value?Number(songSchedule.value):null,notes:songNotes.value.trim()};if(!obj.title)throw new Error('Informe o nome da música.');await req('/rest/v1/ieadjo_songs',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(obj)});msg(secMsg,'Música adicionada ao repertório.',true);loadSongs()}catch(e){msg(secMsg,e.message)}}async function loadSongs(){try{const rows=await req('/rest/v1/ieadjo_songs?select=*&order=created_at.desc');items.innerHTML=rows.map(r=>`<div class="item"><div><b>${esc(r.title)} <span class="daytag">${esc(dayLabel(r.service_day))}</span></b><small>Tom: ${esc(r.song_key||'-')}${r.notes?' • '+esc(r.notes):''}${r.schedule_id?' • Vinculada à escala #'+r.schedule_id:''}</small></div><button class="btn danger" data-song="${r.id}">Remover</button></div>`).join('')||'<small>Nenhuma música.</small>';items.querySelectorAll('[data-song]').forEach(b=>b.onclick=async()=>{await req('/rest/v1/ieadjo_songs?id=eq.'+b.dataset.song,{method:'DELETE'});loadSongs()})}catch(e){msg(secMsg,e.message)}}
document.querySelectorAll('.tile').forEach(b=>b.onclick=()=>openSec(b.dataset.sec));document.getElementById('login').onclick=login;document.getElementById('signup').onclick=signup;document.getElementById('addLeader').onclick=addLeader;document.getElementById('logout').onclick=()=>{clear();location.reload()};enter();
</script></body></html>
