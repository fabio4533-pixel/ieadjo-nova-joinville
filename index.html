<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0e2a47"><link rel="manifest" href="/manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="IEADJO Nova Joinville"><link rel="apple-touch-icon" href="/igreja-hq.jpg"><link rel="icon" href="/igreja-hq.jpg"><title>IEADJO Nova Joinville</title>
<style>
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#0e2a47}*{box-sizing:border-box}.hidden{display:none!important}#site{width:100%;height:100vh;border:0;display:block;background:#fff}.authscreen{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(160deg,#0e2a47,#174f7c)}.authcard{width:min(430px,100%);background:#fff;border-radius:24px;padding:24px;box-shadow:0 20px 60px #0005;color:#152433}.authbrand{display:flex;gap:12px;align-items:center;margin-bottom:18px}.authbrand img{width:62px;height:62px;border-radius:18px;object-fit:cover}.authbrand h1{font-size:20px;margin:0}.authbrand p{font-size:12px;color:#6b7885;margin:3px 0 0}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#eef3f7;border-radius:12px;padding:4px;margin:14px 0}.tabs button{border:0;background:transparent;border-radius:9px;padding:10px;font-weight:800;color:#607080}.tabs button.active{background:#fff;color:#0e2a47;box-shadow:0 2px 8px #0001}.field{margin:11px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:5px}.field input{width:100%;padding:12px;border:1px solid #dfe6ec;border-radius:11px;font:inherit}.authbtn{width:100%;border:0;border-radius:12px;padding:13px;background:#0e2a47;color:#fff;font-weight:800;margin-top:6px}.authmsg{min-height:20px;font-size:12px;margin-top:10px;color:#b93838}.authmsg.ok{color:#238b57}.note{font-size:11px;color:#6b7885;line-height:1.45;margin-top:12px}.pending{background:#fff7e8;border:1px solid #efd9a9;border-radius:12px;padding:10px;margin-top:12px;color:#765e27;font-size:12px;line-height:1.4}.rejected{background:#fff0f0;border-color:#efcaca;color:#8f2f2f}.installfloat{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:3000;width:min(430px,calc(100% - 24px));background:#fff;color:#152433;border-radius:22px;padding:12px;box-shadow:0 14px 45px #0005;border:1px solid #dfe6ec;display:flex;gap:11px;align-items:center}.appthumb{width:54px;height:54px;border-radius:15px;object-fit:cover;flex:none}.installcopy{min-width:0;flex:1}.installcopy strong{display:block;font-size:14px}.installcopy small{display:block;color:#687887;font-size:11px;margin-top:3px}.installbuttons{display:flex;gap:6px;margin-top:8px}.installbuttons button{border:0;border-radius:10px;padding:9px 10px;font-weight:800;font-size:11px}.android{background:#59c78b;color:#073c24}.ios{background:#0e2a47;color:#fff}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:4000;padding:22px}.box{max-width:360px;background:#fff;border-radius:18px;padding:20px;color:#152433}.box button{width:100%;padding:12px;border:0;border-radius:10px;background:#0e2a47;color:#fff;font-weight:800}.logoutbtn{position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;z-index:3500;border:0;border-radius:999px;background:#fff;color:#0e2a47;padding:10px 14px;font-weight:800;box-shadow:0 5px 18px #0003;cursor:pointer}
</style></head><body>
<section id="authscreen" class="authscreen"><div class="authcard"><div class="authbrand"><img src="/igreja-hq.jpg" alt="IEADJO"><div><h1>IEADJO Nova Joinville</h1><p>Acesso dos integrantes</p></div></div><div class="tabs"><button id="tabLogin" class="active">Entrar</button><button id="tabSignup">Solicitar cadastro</button></div><div id="nameField" class="field hidden"><label>Nome completo</label><input id="memberName" autocomplete="name" placeholder="Seu nome"></div><div id="birthField" class="field hidden"><label>Data de nascimento</label><input id="memberBirthDate" type="date" autocomplete="bday"></div><div class="field"><label>E-mail / login</label><input id="memberEmail" type="email" autocomplete="email" placeholder="seuemail@exemplo.com"></div><div class="field"><label>Senha</label><input id="memberPassword" type="password" autocomplete="current-password" placeholder="Mínimo 6 caracteres"></div><button id="authAction" class="authbtn">Entrar no aplicativo</button><div id="authMsg" class="authmsg"></div><div id="pendingInfo" class="pending hidden"></div><div class="note">Novos cadastros precisam ser aprovados pela liderança antes do primeiro acesso.</div></div></section>
<iframe id="site" class="hidden" src="/index-1.html?v=12" title="IEADJO Nova Joinville"></iframe>
<button id="logoutBtn" class="logoutbtn hidden" type="button">↪ Sair</button>
<div id="installfloat" class="installfloat hidden"><img class="appthumb" src="/igreja-hq.jpg"><div class="installcopy"><strong>IEADJO Nova Joinville</strong><small>Instale o aplicativo no seu celular</small><div class="installbuttons"><button id="installAndroid" class="android">🤖 Android</button><button id="installIOS" class="ios"> iPhone</button></div></div></div>
<div id="iosModal" class="modal hidden"><div class="box"><h3>Instalar IEADJO</h3><p>No iPhone, toque em <b>Compartilhar</b> no Safari e depois em <b>Adicionar à Tela de Início</b>.</p><button id="closeModal">Entendi</button></div></div>
<script>
const SB_URL='https://fzpffyouubmbxfwycywg.supabase.co',SB_KEY='sb_publishable_fqG3I5cRWBXjn-EP0FoATA_0-SWvfsR';
let mode='login',session=null,deferredPrompt=null,adminSchedules=[],scheduleRoster=[],birthdayMembers=[],memberProfile=null,lastLocalProfile='';
const authscreen=document.getElementById('authscreen'),site=document.getElementById('site'),authMsg=document.getElementById('authMsg'),floatBox=document.getElementById('installfloat'),pendingInfo=document.getElementById('pendingInfo'),logoutBtn=document.getElementById('logoutBtn');
function setMsg(t,ok=false){authMsg.textContent=t;authMsg.className='authmsg'+(ok?' ok':'')}
function saveSession(s){session=s;localStorage.setItem('ieadjo_member_session',JSON.stringify(s))}
function clearSession(){session=null;localStorage.removeItem('ieadjo_member_session')}
function stored(){try{return JSON.parse(localStorage.getItem('ieadjo_member_session')||'null')}catch{return null}}
async function sb(path,o={}){const h={'apikey':SB_KEY,'Content-Type':'application/json',...(o.headers||{})};if(o.token)h.Authorization='Bearer '+o.token;const r=await fetch(SB_URL+path,{...o,headers:h});let d=null;try{d=await r.json()}catch{}if(!r.ok)throw new Error(d?.msg||d?.message||d?.error_description||'Não foi possível concluir.');return d}
function switchMode(m){mode=m;tabLogin.classList.toggle('active',m==='login');tabSignup.classList.toggle('active',m==='signup');nameField.classList.toggle('hidden',m!=='signup');birthField.classList.toggle('hidden',m!=='signup');authAction.textContent=m==='signup'?'Enviar solicitação de cadastro':'Entrar no aplicativo';memberPassword.autocomplete=m==='signup'?'new-password':'current-password';pendingInfo.className='pending hidden';pendingInfo.textContent='';setMsg('')}
tabLogin.onclick=()=>switchMode('login');tabSignup.onclick=()=>switchMode('signup');
function memberLocalObject(){return {name:memberProfile?.name||session?.user?.user_metadata?.full_name||'Integrante',role:memberProfile?.role_text||'Membro do grupo',phone:memberProfile?.phone||'',bio:memberProfile?.bio||'',photo:memberProfile?.photo||''}}
function writeProfileToLocal(){if(!memberProfile)return;const obj=memberLocalObject();lastLocalProfile=JSON.stringify(obj);localStorage.setItem('ieadjo_member_profile',lastLocalProfile)}
async function loadMemberProfile(){if(!session?.access_token)return null;try{const rows=await sb('/rest/v1/ieadjo_members?select=id,name,role_text,email,available,user_id,approved,access_status,requested_at,phone,bio,photo,birth_date&user_id=eq.'+encodeURIComponent(session.user.id)+'&limit=1',{token:session.access_token});memberProfile=rows?.[0]||null;if(memberProfile)writeProfileToLocal();return memberProfile}catch{memberProfile=null;return null}}
async function requireApproval(){await loadMemberProfile();if(memberProfile?.approved===true&&memberProfile?.access_status==='approved')return true;const status=memberProfile?.access_status||'pending';clearSession();pendingInfo.classList.remove('hidden','rejected');if(status==='rejected'){pendingInfo.classList.add('rejected');pendingInfo.textContent='❌ Sua solicitação foi recusada ou seu acesso está bloqueado. Procure a liderança para revisar o cadastro.';setMsg('Acesso não autorizado.')}else{pendingInfo.textContent='⏳ Solicitação enviada. Seu acesso está aguardando aprovação da liderança no painel administrativo.';setMsg('Aguardando aprovação da liderança.',true)}authscreen.classList.remove('hidden');site.classList.add('hidden');floatBox.classList.add('hidden');logoutBtn.classList.add('hidden');return false}
authAction.onclick=async()=>{const email=memberEmail.value.trim().toLowerCase(),password=memberPassword.value,name=memberName.value.trim(),birthDate=memberBirthDate.value;try{if(!email||password.length<6)throw new Error('Informe um e-mail válido e uma senha com pelo menos 6 caracteres.');authAction.disabled=true;if(mode==='signup'){if(!name)throw new Error('Informe seu nome completo.');if(!birthDate)throw new Error('Informe sua data de nascimento.');const d=await sb('/auth/v1/signup',{method:'POST',body:JSON.stringify({email,password,data:{full_name:name,birth_date:birthDate}})});if(d.access_token){saveSession(d);await requireApproval()}else{switchMode('login');pendingInfo.classList.remove('hidden');pendingInfo.textContent='📩 Cadastro criado. A liderança precisa aprovar sua solicitação antes do primeiro acesso.';setMsg('Solicitação de cadastro enviada.',true)}}else{const d=await sb('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})});saveSession(d);if(await requireApproval())openApp()}}catch(e){setMsg(e.message)}finally{authAction.disabled=false}};
async function validateSession(){let s=stored();if(!s)return false;try{await sb('/auth/v1/user',{token:s.access_token});saveSession(s);return true}catch{}if(s.refresh_token){try{const d=await sb('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:s.refresh_token})});saveSession(d);return true}catch{}}clearSession();return false}
function openApp(){pendingInfo.className='pending hidden';authscreen.classList.add('hidden');site.classList.remove('hidden');logoutBtn.classList.remove('hidden');if(!window.matchMedia('(display-mode: standalone)').matches&&!navigator.standalone)floatBox.classList.remove('hidden');fetchSchedules();fetchBirthdays();setTimeout(patchIframe,100)}
logoutBtn.onclick=async()=>{if(!confirm('Deseja sair da sua conta?'))return;try{if(session?.access_token)await sb('/auth/v1/logout',{method:'POST',token:session.access_token})}catch{}clearSession();memberProfile=null;lastLocalProfile='';localStorage.removeItem('ieadjo_member_profile');memberEmail.value='';memberPassword.value='';memberBirthDate.value='';site.classList.add('hidden');floatBox.classList.add('hidden');logoutBtn.classList.add('hidden');authscreen.classList.remove('hidden');switchMode('login');setMsg('Você saiu do aplicativo.',true)};
(async()=>{if(await validateSession()){if(await requireApproval())openApp()}})();
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installAndroid.textContent='🤖 Instalar'});installAndroid.onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();const c=await deferredPrompt.userChoice;if(c.outcome==='accepted')floatBox.classList.add('hidden');deferredPrompt=null}else alert('Abra pelo Google Chrome do Android para instalar.')};installIOS.onclick=()=>iosModal.classList.remove('hidden');closeModal.onclick=()=>iosModal.classList.add('hidden');window.addEventListener('appinstalled',()=>floatBox.classList.add('hidden'));
function safe(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#039;'}[m]))}
function localDate(iso){const [y,m,d]=String(iso).split('-').map(Number);return new Date(y,m-1,d,12)}
function fmtShort(iso){const d=localDate(iso),wk=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'],mo=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];return `${wk[d.getDay()]} • ${d.getDate()} ${mo[d.getMonth()]}`}
function fmtMonth(iso){return localDate(iso).toLocaleDateString('pt-BR',{month:'short'}).replace('.','').toUpperCase()}
function cifraSearch(title,letter=false){return 'https://www.cifraclub.com.br/search/?q='+encodeURIComponent(title+(letter?' letra':''))}
function patchCifraButtons(doc,view){const ph=view.querySelector('.pagehead h1');if(!ph||ph.textContent.trim()!=='Repertório')return;view.querySelectorAll('.song').forEach(card=>{const title=(card.querySelector('.grow b')?.textContent||'').trim();if(!title)return;card.querySelectorAll('button').forEach(b=>b.remove());let box=card.querySelector('.cifraActions');if(!box){box=doc.createElement('div');box.className='cifraActions';box.style.cssText='display:flex;flex-direction:column;gap:6px;flex:none';card.appendChild(box)}box.innerHTML='';[['🎸 Cifra',cifraSearch(title,false)],['📄 Letra',cifraSearch(title,true)]].forEach(([label,url])=>{const a=doc.createElement('a');a.textContent=label;a.href=url;a.target='_blank';a.rel='noopener noreferrer external';a.style.cssText='display:block;text-decoration:none;text-align:center;border-radius:10px;background:#0e2a47;color:#fff;padding:9px 10px;font-size:11px;font-weight:800;white-space:nowrap';a.addEventListener('click',e=>{e.stopPropagation()});box.appendChild(a)})})}
function rosterFor(id){return scheduleRoster.filter(x=>x.schedule_id===id)}
function rosterText(id){const r=rosterFor(id);return r.length?r.map(x=>`${x.member_name}${x.assignment_role?' ('+x.assignment_role+')':x.member_role?' ('+x.member_role+')':''}`).join(', '):'Equipe a definir'}
async function fetchSchedules(){try{const t=new Date(),first=`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-01`;const [s,r]=await Promise.all([sb('/rest/v1/ieadjo_schedules?select=id,event_date,title,time_text&event_date=gte.'+first+'&order=event_date.asc,id.asc',{token:session.access_token}),sb('/rest/v1/rpc/ieadjo_schedule_roster',{method:'POST',token:session.access_token,body:'{}'})]);adminSchedules=s||[];scheduleRoster=r||[];patchIframe()}catch(e){console.warn('Escalas:',e)}}
async function fetchBirthdays(){try{const rows=await sb('/rest/v1/ieadjo_members?select=id,name,photo,birth_date&approved=eq.true&access_status=eq.approved&birth_date=not.is.null&order=name.asc',{token:session.access_token});birthdayMembers=rows||[];patchIframe()}catch(e){console.warn('Aniversariantes:',e)}}
function initials(name){const a=String(name||'Integrante').trim().split(/\s+/);return ((a[0]?.[0]||'I')+(a.length>1?a[a.length-1][0]||'':'')).toUpperCase()}
function birthdayMarkup(){const month=new Date().getMonth()+1,people=birthdayMembers.filter(m=>Number(String(m.birth_date).slice(5,7))===month).sort((a,b)=>Number(String(a.birth_date).slice(8,10))-Number(String(b.birth_date).slice(8,10)));if(!people.length)return '';const items=people.map(m=>{const day=String(m.birth_date).slice(8,10),avatar=m.photo?`<img src="${safe(m.photo)}" alt="Foto de ${safe(m.name)}" style="width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid #fff;box-shadow:0 2px 8px #0002">`:`<span style="width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#b27600;font-weight:900;border:2px solid #fff;box-shadow:0 2px 8px #0002">${safe(initials(m.name))}</span>`;return `<div style="display:flex;align-items:center;gap:10px;padding:8px 0">${avatar}<div style="min-width:0"><b style="display:block;color:#3d2a00;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${safe(m.name)}</b><span style="font-size:11px;color:#765e27">🎂 Dia ${day}</span></div></div>`}).join('');return `<section id="birthdayHighlight" style="margin:12px 0 14px;padding:14px;border-radius:18px;background:linear-gradient(135deg,#fff4c8,#ffe39a);border:1px solid #e4c16b;box-shadow:0 8px 22px #00000012"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:5px"><div><span style="display:block;font-size:10px;font-weight:900;letter-spacing:.7px;color:#9a6a00">DESTAQUE</span><b style="font-size:15px;color:#4c3400">🎉 ANIVERSARIANTE DO MÊS</b></div><span style="font-size:22px">🎂</span></div>${items}</section>`}
function calendarMarkup(){const now=new Date(),y=now.getFullYear(),m=now.getMonth(),first=new Date(y,m,1),daysInMonth=new Date(y,m+1,0).getDate(),start=first.getDay(),monthName=first.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});let ds='';for(let i=0;i<42;i++){const d=i-start+1;if(d<1||d>daysInMonth){ds+='<span></span>';continue}const iso=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,events=adminSchedules.filter(s=>s.event_date===iso);ds+=`<span class="${events.length?'event':''}" title="${safe(events.map(e=>e.title).join(' • '))}">${d}</span>`}const eventList=adminSchedules.filter(s=>{const dt=localDate(s.event_date);return dt.getFullYear()===y&&dt.getMonth()===m}).map(s=>`<div class="card"><div class="date">${String(localDate(s.event_date).getDate()).padStart(2,'0')}<small>${fmtMonth(s.event_date)}</small></div><div class="grow"><b>${safe(s.title)}</b><span>${safe((s.time_text||'Horário a definir')+' • '+rosterText(s.id))}</span></div></div>`).join('');return `<div class="calendar"><div class="calhead"><b>${safe(monthName.charAt(0).toUpperCase()+monthName.slice(1))}</b><span>Calendário dinâmico</span></div><div class="week"><span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span></div><div class="days">${ds}</div></div>${eventList}`}
function patchIframe(){let doc;try{doc=site.contentDocument||site.contentWindow.document}catch{return}if(!doc)return;const view=doc.getElementById('view');if(!view)return;patchCifraButtons(doc,view);const displayName=memberProfile?.name||session?.user?.user_metadata?.full_name||'Integrante';const personalRole=memberProfile?.role_text||'Membro do grupo';const hello=view.querySelector('.hello p');if(hello)hello.textContent=`Olá, ${displayName} 👋`;const roleAny=view.querySelector('.role b');if(roleAny)roleAny.textContent=personalRole;const oldBirthday=view.querySelector('#birthdayHighlight');if(oldBirthday)oldBirthday.remove();if(view.querySelector('.hello')){const b=birthdayMarkup();if(b)view.querySelector('.hello').insertAdjacentHTML('afterend',b)}if(adminSchedules.length){const today=new Date();today.setHours(0,0,0,0);const upcoming=adminSchedules.filter(s=>localDate(s.event_date)>=today);const next=upcoming[0]||adminSchedules[0],hero=view.querySelector('.hero');if(hero&&next){const date=hero.querySelector('.herohead span:last-child');if(date)date.textContent=fmtShort(next.event_date);const h2=hero.querySelector('h2');if(h2)h2.textContent=next.title||'Próxima escala';const muted=hero.querySelector('.muted');if(muted)muted.textContent=`${next.time_text||'Horário a definir'} • Templo IEADJO Nova Joinville`;const role=hero.querySelector('.role b');if(role)role.textContent=personalRole}const ph=view.querySelector('.pagehead h1');if(ph&&ph.textContent.trim()==='Minhas escalas'){const pagehead=view.querySelector('.pagehead');view.querySelectorAll('.card').forEach(x=>x.remove());const cards=upcoming.map((s,i)=>{const dt=localDate(s.event_date),mine=rosterFor(s.id).find(x=>x.member_id===memberProfile?.id),myRole=mine?.assignment_role||mine?.member_role||personalRole;return `<div class="card"><div class="date">${String(dt.getDate()).padStart(2,'0')}<small>${fmtMonth(s.event_date)}</small></div><div class="grow"><b>${safe(s.title)}</b><span>${safe((s.time_text||'Horário a definir')+' • '+rosterText(s.id))}</span>${mine?`<span><b>Sua função:</b> ${safe(myRole)}</span>`:''}</div><span class="status ${i===0?'ok':''}">${i===0?'Próxima':'Programada'}</span></div>`}).join('');pagehead.insertAdjacentHTML('afterend',cards||'<small>Nenhuma escala programada.</small>')}if(ph&&ph.textContent.trim()==='Calendário'){const pagehead=view.querySelector('.pagehead');view.querySelector('.calendar')?.remove();view.querySelectorAll('.card').forEach(x=>x.remove());pagehead.insertAdjacentHTML('afterend',calendarMarkup())}}}
async function syncLocalProfile(){if(!session?.access_token||!memberProfile?.id)return;const raw=localStorage.getItem('ieadjo_member_profile')||'';if(!raw||raw===lastLocalProfile)return;let p;try{p=JSON.parse(raw)}catch{return}const obj={name:String(p.name||memberProfile.name||'Integrante').trim(),role_text:String(p.role||'Membro do grupo').trim(),phone:String(p.phone||'').trim(),bio:String(p.bio||'').trim(),photo:String(p.photo||'')};try{const rows=await sb('/rest/v1/ieadjo_members?user_id=eq.'+encodeURIComponent(session.user.id),{method:'PATCH',token:session.access_token,headers:{Prefer:'return=representation'},body:JSON.stringify(obj)});if(rows?.[0])memberProfile={...memberProfile,...rows[0]};lastLocalProfile=JSON.stringify({name:obj.name,role:obj.role_text,phone:obj.phone,bio:obj.bio,photo:obj.photo});patchIframe()}catch(e){console.warn('Perfil:',e)}}
site.addEventListener('load',()=>{writeProfileToLocal();fetchSchedules();fetchBirthdays();try{const view=site.contentDocument.getElementById('view');if(view)new MutationObserver(()=>setTimeout(patchIframe,30)).observe(view,{childList:true,subtree:true})}catch{}});
setInterval(()=>{if(session)syncLocalProfile()},1200);
setInterval(async()=>{if(session){await loadMemberProfile();fetchSchedules();fetchBirthdays()}},60000);
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
</script></body></html>
