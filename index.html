<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e2a47">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="IEADJO">
<link rel="apple-touch-icon" href="/igreja-hq.jpg">
<title>IEADJO Nova Joinville</title>
<style>
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#0e2a47}*{box-sizing:border-box}
.installbar{min-height:72px;background:#0e2a47;color:#fff;padding:10px 12px;display:flex;gap:8px;align-items:center;justify-content:center;position:sticky;top:0;z-index:1000;box-shadow:0 2px 10px #0003}
.installbar strong{font-size:13px;margin-right:4px}.installbar button{border:0;border-radius:12px;padding:11px 13px;font-weight:800;cursor:pointer}.android{background:#59c78b;color:#073c24}.ios{background:#fff;color:#0e2a47}.hidden{display:none!important}
#site{width:100%;height:calc(100vh - 72px);border:0;display:block;background:#fff}
.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:2000;padding:22px}.box{max-width:360px;background:#fff;border-radius:18px;padding:20px;color:#152433}.box h3{margin:0 0 8px}.box p{line-height:1.45;font-size:14px}.box button{width:100%;padding:12px;border:0;border-radius:10px;background:#0e2a47;color:#fff;font-weight:800}
@media(max-width:520px){.installbar{flex-wrap:wrap}.installbar strong{width:100%;text-align:center}.installbar button{flex:1}#site{height:calc(100vh - 92px)}}
</style>
</head>
<body>
<div id="installbar" class="installbar">
  <strong>Instale o aplicativo IEADJO</strong>
  <button id="installAndroid" class="android">🤖 Instalar no Android</button>
  <button id="installIOS" class="ios"> Instalar no iPhone</button>
</div>
<iframe id="site" src="/index-1.html" title="IEADJO Nova Joinville"></iframe>
<div id="iosModal" class="modal hidden"><div class="box"><h3>Instalar no iPhone</h3><p>No iPhone, a Apple exige uma confirmação pelo Safari. Toque em <b>Compartilhar</b> e depois em <b>Adicionar à Tela de Início</b>.</p><button id="closeModal">Entendi</button></div></div>
<script>
let deferredPrompt=null;
const bar=document.getElementById('installbar');
const androidBtn=document.getElementById('installAndroid');
const iosBtn=document.getElementById('installIOS');
const modal=document.getElementById('iosModal');

window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();
  deferredPrompt=e;
  androidBtn.textContent='🤖 Instalar agora';
});

androidBtn.addEventListener('click',async()=>{
  if(deferredPrompt){
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt=null;
    return;
  }
  if(window.matchMedia('(display-mode: standalone)').matches){
    alert('O aplicativo já está instalado neste aparelho.');
    return;
  }
  alert('Abra este site no Google Chrome do Android. Quando o navegador liberar a instalação, toque novamente em “Instalar”.');
});

iosBtn.addEventListener('click',async()=>{
  const ua=navigator.userAgent.toLowerCase();
  const isIOS=/iphone|ipad|ipod/.test(ua);
  if(!isIOS){ modal.classList.remove('hidden'); return; }
  if(navigator.standalone){ alert('O aplicativo já está instalado neste iPhone.'); return; }
  if(navigator.share){
    try{
      await navigator.share({title:'IEADJO Nova Joinville',text:'Instalar aplicativo IEADJO',url:location.origin});
      return;
    }catch(e){}
  }
  modal.classList.remove('hidden');
});

document.getElementById('closeModal').onclick=()=>modal.classList.add('hidden');
window.addEventListener('appinstalled',()=>{bar.classList.add('hidden');document.getElementById('site').style.height='100vh';});
if(window.matchMedia('(display-mode: standalone)').matches || navigator.standalone){bar.classList.add('hidden');document.getElementById('site').style.height='100vh';}

if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));}
</script>
</body>
</html>
