<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0e2a47"><title>IEADJO • Painel da Liderança</title><style>
:root{--navy:#0e2a47;--bg:#f4f7fa;--text:#152433;--muted:#6b7885;--line:#dfe6ec;--green:#238b57;--red:#b93838}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(180deg,#0e2a47 0,#173b5d 260px,#f4f7fa 260px);color:var(--text);min-height:100vh}.wrap{max-width:1120px;margin:auto;padding:22px 14px 50px}.top,.dashhead{display:flex;justify-content:space-between;align-items:center;gap:12px;color:#fff;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:54px;height:54px;border-radius:16px;object-fit:cover}.brand h1,.dashhead h2{margin:0}.brand p,.dashhead small{margin:2px 0 0;font-size:12px;opacity:.8}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 12px 32px #0e2a4720}.auth{max-width:430px;margin:34px auto}.field{margin-top:12px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:5px}.field input,.inline input,.inline select{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px}.row,.inline,.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:800;cursor:pointer}.primary{background:var(--navy);color:#fff}.ghost{background:#edf2f6;color:var(--navy)}.success{background:#e8f7ef;color:#206b47}.danger{background:#fff0f0;color:#a12e2e}.msg{font-size:12px;margin-top:9px;min-height:18px}.ok{color:var(--green)}.err{color:var(--red)}.hidden{display:none!important}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.tile{position:relative;background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;cursor:pointer;text-align:left}.tile span{font-size:24px}.tile b{display:block;margin-top:6px}.tile small,.item small{color:var(--muted)}.tile.active{border-color:#91a8bb;box-shadow:0 7px 18px #0e2a4718}.badge{position:absolute;right:8px;top:8px;background:#c83232;color:#fff;border-radius:99px;min-width:22px;height:22px;padding:0 6px;display:grid;place-items:center;font-size:11px;font-weight:900}.section{margin-top:14px}.list{margin-top:10px}.item{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--line);padding:13px 0}.item:first-child{border-top:0}.item b{display:block}.status{display:inline-block;margin:5px 4px 0 0;padding:4px 8px;border-radius:99px;background:#eef4f9;color:#174f7c;font-size:10px;font-weight:900}.status.okay{background:#e8f7ef;color:#206b47}.status.blocked{background:#fff0f0;color:#a12e2e}.status.pending{background:#fff7e8;color:#8a6418}.leaders{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}.leaders input{border:1px solid var(--line);border-radius:11px;padding:12px}.back{color:#fff;text-decoration:none;font-weight:800;font-size:12px}.scheduleBox{border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:10px}.scheduleBox h4{margin:0 0 4px}.roster{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}.person{display:grid;grid-template-columns:auto 1fr 1fr;gap:8px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:9px}.person input[type=checkbox]{width:20px;height:20px}.person input[type=text]{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px}.assigned{margin-top:8px;font-size:12px;color:#445564}.assigned b{display:inline}.calendarHint{background:#eef4f9;border-radius:12px;padding:10px;margin-top:10px;font-size:12px;color:#36536c}@media(max-width:980px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:680px){.grid{grid-template-columns:1fr 1fr}.top,.dashhead{align-items:flex-start;flex-direction:column}.leaders,.inline,.roster{display:grid;grid-template-columns:1fr}.item{align-items:flex-start;flex-direction:column}.person{grid-template-columns:auto 1fr}.person input[type=text]{grid-column:1/3}}@media(max-width:420px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><div class="brand"><img src="/igreja-hq.jpg"><div><h1>IEADJO Nova Joinville</h1><p>Painel administrativo da liderança</p></div></div></div>
<section id="auth" class="card auth"><h2>Acesso restrito</h2><p>Somente líderes autorizados.</p><div class="field"><label>E-mail</label><input id="email" type="email"></div><div class="field"><label>Senha</label><input id="password" type="password"></div><div class="row"><button id="login" class="btn primary">Entrar</button><button id="signup" class="btn ghost">Primeiro acesso</button></div><div id="authMsg" class="msg"></div></section>
<section id="dashboard" class="hidden"><div class="dashhead"><div><h2>Painel da Liderança</h2><small id="who"></small></div><div><a class="back" href="/">← Voltar</a> &nbsp; <button id="logout" class="btn ghost">Sair</button></div></div><div class="grid"><button class="tile" data-sec="requests"><span>🔔</span><b>Solicitações</b><small>Aprovar ou recusar</small><i id="requestBadge" class="badge hidden">0</i></button><button class="tile" data-sec="schedules"><span>📋</span><b>Escalas</b><small>Datas e integrantes</small></button><button class="tile" data-sec="members"><span>👥</span><b>Integrantes</b><small>Equipe</small></button><button class="tile" data-sec="access"><span>🔐</span><b>Acessos</b><small>Liberar e excluir</small></button><button class="tile" data-sec="songs"><span>🎵</span><b>Repertório</b><small>Por culto</small></button><button class="tile" data-sec="notices"><span>📢</span><b>Avisos</b><small>Comunicados</small></button></div><div id="work" class="card section"><h3>Escolha uma área acima</h3></div><div class="card section"><h3>Líderes autorizados</h3><div class="leaders"><input id="leaderName" placeholder="Nome"><input id="leaderEmail" type="email" placeholder="E-mail"><button id="addLeader" class="btn primary">Adicionar</button></div><div id="leaderMsg" class="msg"></div><div id="leaders" class="list"></div></div></section></div>
<script>
const U='https://fzpffyouubmbxfwycywg.supabase.co',K='sb_publishable_fqG3I5cRWBXjn-EP0FoATA_0-SWvfsR';const auth=document.getElementById('auth'),dashboard=document.getElementById('dashboard'),authMsg=document.getElementById('authMsg'),leaderMsg=document.getElementById('leaderMsg'),work=document.getElementById('work');function S(){try{return JSON.parse(localStorage.getItem('ieadjo_admin_session')||'null')}catch{return null}}function save(s){localStorage.setItem('ieadjo_admin_session',JSON.stringify(s))}function clear(){localStorage.removeItem('ieadjo_admin_session')}function msg(el,t,ok=false){el.textContent=t;el.className='msg '+(ok?'ok':'err')}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}async function req(path,o={}){const s=S(),h={'apikey':K,'Content-Type':'application/json',...(o.headers||{})};if(s?.access_token)h.Authorization='Bearer '+s.access_token;const r=await fetch(U+path,{...o,headers:h});let d=null;try{d=await r.json()}catch{}if(!r.ok)throw new Error(d?.message||d?.msg||d?.error_description||'Erro');return d}
async function verify(){try{return !!(await req('/rest/v1/ieadjo_leaders?select=email&limit=1')).length}catch{return false}}async function enter(){if(await verify()){auth.classList.add('hidden');dashboard.classList.remove('hidden');who.textContent=S()?.user?.email||'';loadLeaders();refreshBadge()}else{clear();auth.classList.remove('hidden');dashboard.classList.add('hidden')}}async function doLogin(){try{const d=await req('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:email.value.trim(),password:password.value})});save(d);if(!(await verify())){clear();throw new Error('Este e-mail não está autorizado como líder.')}enter()}catch(e){msg(authMsg,e.message)}}async function doSignup(){try{if(password.value.length<6)throw new Error('Use uma senha com pelo menos 6 caracteres.');const d=await req('/auth/v1/signup',{method:'POST',body:JSON.stringify({email:email.value.trim(),password:password.value})});if(d.access_token){save(d);enter()}else msg(authMsg,'Conta criada. Confirme o e-mail e depois entre.',true)}catch(e){msg(authMsg,e.message)}}
async function loadLeaders(){try{const rows=await req('/rest/v1/ieadjo_leaders?select=email,display_name,created_at&order=created_at.asc');leaders.innerHTML=rows.map(r=>`<div class="item"><div><b>${esc(r.display_name||'Líder')}</b><small>${esc(r.email)}</small></div><button class="btn danger" data-leader="${encodeURIComponent(r.email)}">Remover</button></div>`).join('');leaders.querySelectorAll('[data-leader]').forEach(b=>b.onclick=async()=>{await req('/rest/v1/ieadjo_leaders?email=eq.'+decodeURIComponent(b.dataset.leader),{method:'DELETE'});loadLeaders()})}catch(e){msg(leaderMsg,e.message)}}async function addLeaderFn(){try{await req('/rest/v1/ieadjo_leaders',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({email:leaderEmail.value.trim().toLowerCase(),display_name:leaderName.value.trim()||null})});leaderName.value='';leaderEmail.value='';msg(leaderMsg,'Líder autorizado.',true);loadLeaders()}catch(e){msg(leaderMsg,e.message)}}
const conf={members:{title:'Integrantes',table:'ieadjo_members',fields:[['name','Nome','text'],['role_text','Função','text'],['email','E-mail','email']]},notices:{title:'Avisos',table:'ieadjo_notices',fields:[['title','Título','text'],['body','Aviso','text']]}};
async function openSec(key){document.querySelectorAll('.tile').forEach(x=>x.classList.toggle('active',x.dataset.sec===key));if(key==='requests')return openRequests();if(key==='access')return openAccess();if(key==='songs')return openSongs();if(key==='schedules')return openSchedules();const c=conf[key];work.innerHTML=`<h3>${c.title}</h3><div class="inline">${c.fields.map(f=>`<input id="f_${f[0]}" type="${f[2]}" placeholder="${f[1]}">`).join('')}<button id="saveItem" class="btn primary">Adicionar</button></div><div id="secMsg" class="msg"></div><div id="items" class="list"></div>`;saveItem.onclick=()=>addItem(key);loadItems(key)}async function addItem(key){const c=conf[key],obj={};c.fields.forEach(f=>obj[f[0]]=document.getElementById('f_'+f[0]).value.trim());try{await req('/rest/v1/'+c.table,{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(obj)});msg(secMsg,'Salvo.',true);loadItems(key)}catch(e){msg(secMsg,e.message)}}async function loadItems(key){const c=conf[key];try{const rows=await req('/rest/v1/'+c.table+'?select=*&order=created_at.desc');items.innerHTML=rows.map(r=>`<div class="item"><div><b>${esc(r.title||r.name)}</b><small>${esc([r.role_text,r.email,r.body].filter(Boolean).join(' • '))}</small></div><button class="btn danger" data-id="${r.id}">Remover</button></div>`).join('')||'<small>Nenhum registro.</small>';items.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{await req('/rest/v1/'+c.table+'?id=eq.'+b.dataset.id,{method:'DELETE'});loadItems(key)})}catch(e){msg(secMsg,e.message)}}
async function openSchedules(){work.innerHTML=`<h3>📋 Escalas por culto</h3><p>Crie o culto e depois escolha os integrantes que servirão nele. A escala aparecerá automaticamente no calendário do aplicativo.</p><div class="inline"><input id="scDate" type="date"><input id="scTitle" placeholder="Culto / evento"><input id="scTime" placeholder="Horário"><button id="addSchedule" class="btn primary">Criar escala</button></div><div class="calendarHint">📅 As datas cadastradas aqui alimentam o calendário dinâmico do aplicativo.</div><div id="secMsg" class="msg"></div><div id="items" class="list"></div>`;addSchedule.onclick=addScheduleFn;loadSchedules()}
async function addScheduleFn(){try{if(!scDate.value||!scTitle.value.trim())throw new Error('Informe a data e o nome do culto.');await req('/rest/v1/ieadjo_schedules',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({event_date:scDate.value,title:scTitle.value.trim(),time_text:scTime.value.trim(),status:'programada'})});scTitle.value='';scTime.value='';msg(secMsg,'Escala criada.',true);loadSchedules()}catch(e){msg(secMsg,e.message)}}
async function loadSchedules(){try{const [schedules,members,assign]=await Promise.all([req('/rest/v1/ieadjo_schedules?select=*&order=event_date.asc,id.asc'),req('/rest/v1/ieadjo_members?select=id,name,role_text&approved=eq.true&access_status=eq.approved&order=name.asc'),req('/rest/v1/ieadjo_schedule_members?select=id,schedule_id,member_id,role_text')]);items.innerHTML=schedules.map(s=>{const a=assign.filter(x=>x.schedule_id===s.id);const names=a.map(x=>{const m=members.find(mm=>mm.id===x.member_id);return m?`${esc(m.name)}${x.role_text?' — '+esc(x.role_text):''}`:''}).filter(Boolean).join(', ');return `<div class="scheduleBox"><h4>${esc(s.title)}</h4><small>${esc(s.event_date)}${s.time_text?' • '+esc(s.time_text):''}</small><div class="assigned"><b>Escalados:</b> ${names||'ninguém ainda'}</div><div class="roster">${members.map(m=>{const hit=a.find(x=>x.member_id===m.id);return `<label class="person"><input type="checkbox" data-check="${s.id}:${m.id}" ${hit?'checked':''}><span><b>${esc(m.name)}</b><small>${esc(m.role_text||'Membro')}</small></span><input type="text" data-role="${s.id}:${m.id}" value="${esc(hit?.role_text||m.role_text||'')}" placeholder="Função neste culto"></label>`}).join('')}</div><div class="actions"><button class="btn primary" data-save-roster="${s.id}">Salvar integrantes</button><button class="btn danger" data-del-schedule="${s.id}">Excluir escala</button></div></div>`}).join('')||'<small>Nenhuma escala cadastrada.</small>';items.querySelectorAll('[data-save-roster]').forEach(b=>b.onclick=()=>saveRoster(Number(b.dataset.saveRoster),members));items.querySelectorAll('[data-del-schedule]').forEach(b=>b.onclick=async()=>{if(!confirm('Excluir esta escala?'))return;await req('/rest/v1/ieadjo_schedules?id=eq.'+b.dataset.delSchedule,{method:'DELETE'});loadSchedules()})}catch(e){msg(secMsg,e.message)}}
async function saveRoster(scheduleId,members){try{await req('/rest/v1/ieadjo_schedule_members?schedule_id=eq.'+scheduleId,{method:'DELETE'});const selected=[];document.querySelectorAll(`[data-check^="${scheduleId}:"]`).forEach(c=>{if(c.checked){const memberId=Number(c.dataset.check.split(':')[1]);const role=document.querySelector(`[data-role="${scheduleId}:${memberId}"]`)?.value.trim()||'';selected.push({schedule_id:scheduleId,member_id:memberId,role_text:role})}});if(selected.length)await req('/rest/v1/ieadjo_schedule_members',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(selected)});msg(secMsg,'Integrantes da escala atualizados.',true);loadSchedules()}catch(e){msg(secMsg,e.message)}}
async function refreshBadge(){try{const r=await req('/rest/v1/ieadjo_members?select=id&access_status=eq.pending&user_id=not.is.null');requestBadge.textContent=r.length;requestBadge.classList.toggle('hidden',!r.length)}catch{}}
async function openRequests(){work.innerHTML='<h3>🔔 Solicitações de cadastro</h3><p>Cadastros novos aguardando decisão.</p><div id="secMsg" class="msg"></div><div id="items" class="list"></div>';loadRequests()}async function loadRequests(){try{const rows=await req('/rest/v1/ieadjo_members?select=id,name,email,requested_at,access_status,user_id&access_status=eq.pending&user_id=not.is.null&order=requested_at.asc');items.innerHTML=rows.map(r=>`<div class="item"><div><b>${esc(r.name||'Integrante')}</b><small>${esc(r.email||'')}</small><br><span class="status pending">AGUARDANDO APROVAÇÃO</span></div><div class="actions"><button class="btn success" data-ap="${r.id}">Aprovar</button><button class="btn danger" data-rj="${r.id}">Recusar</button><button class="btn danger" data-del="${r.id}">Excluir cadastro</button></div></div>`).join('')||'<small>Nenhuma solicitação pendente.</small>';items.querySelectorAll('[data-ap]').forEach(b=>b.onclick=()=>review(b.dataset.ap,true));items.querySelectorAll('[data-rj]').forEach(b=>b.onclick=()=>review(b.dataset.rj,false));items.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>deleteMember(b.dataset.del));refreshBadge()}catch(e){msg(secMsg,e.message)}}async function review(id,ok){try{await req('/rest/v1/ieadjo_members?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({approved:ok,access_status:ok?'approved':'rejected',reviewed_at:new Date().toISOString()})});loadRequests()}catch(e){msg(secMsg,e.message)}}
async function openAccess(){work.innerHTML='<h3>🔐 Acessos dos integrantes</h3><p>O e-mail é o login. Você pode liberar, bloquear ou excluir definitivamente o cadastro.</p><div class="inline"><input id="accessName" placeholder="Nome do integrante"><input id="accessEmail" type="email" placeholder="E-mail / login"><button id="grantAccess" class="btn primary">Liberar acesso</button></div><div id="secMsg" class="msg"></div><div id="items" class="list"></div>';grantAccess.onclick=grant;loadAccess()}async function grant(){const name=accessName.value.trim(),email=accessEmail.value.trim().toLowerCase();if(!name||!email)return msg(secMsg,'Informe nome e e-mail.');try{const f=await req('/rest/v1/ieadjo_members?select=id&email=ilike.'+encodeURIComponent(email)+'&limit=1');if(f.length)await req('/rest/v1/ieadjo_members?id=eq.'+f[0].id,{method:'PATCH',body:JSON.stringify({name,email,approved:true,access_status:'approved',reviewed_at:new Date().toISOString()})});else await req('/rest/v1/ieadjo_members',{method:'POST',body:JSON.stringify({name,email,approved:true,access_status:'approved',available:true,reviewed_at:new Date().toISOString()})});accessName.value='';accessEmail.value='';loadAccess();refreshBadge()}catch(e){msg(secMsg,e.message)}}async function setAccess(id,ok){try{await req('/rest/v1/ieadjo_members?id=eq.'+id,{method:'PATCH',body:JSON.stringify({approved:ok,access_status:ok?'approved':'rejected',reviewed_at:new Date().toISOString()})});loadAccess();refreshBadge()}catch(e){msg(secMsg,e.message)}}async function deleteMember(id){if(!confirm('Excluir este cadastro definitivamente?'))return;try{await req('/rest/v1/rpc/ieadjo_delete_member',{method:'POST',body:JSON.stringify({p_member_id:Number(id)})});msg(secMsg,'Cadastro excluído.',true);if(document.querySelector('[data-sec="access"].active'))loadAccess();else loadRequests();refreshBadge()}catch(e){msg(secMsg,e.message)}}async function loadAccess(){try{const rows=await req('/rest/v1/ieadjo_members?select=id,name,email,approved,user_id,role_text,access_status&order=created_at.desc');items.innerHTML=rows.map(r=>{const st=r.access_status||(r.approved?'approved':'pending');return `<div class="item"><div><b>${esc(r.name||'Integrante')}</b><small>${esc(r.email||'Sem e-mail')}</small><br><span class="status ${st==='approved'?'okay':st==='pending'?'pending':'blocked'}">${st==='approved'?'ACESSO LIBERADO':st==='pending'?'PENDENTE':'RECUSADO/BLOQUEADO'}</span></div><div class="actions">${st==='approved'?`<button class="btn danger" data-block="${r.id}">Bloquear</button>`:`<button class="btn success" data-allow="${r.id}">Liberar</button>`}<button class="btn danger" data-delete="${r.id}">Excluir cadastro</button></div></div>`}).join('')||'<small>Nenhum integrante cadastrado.</small>';items.querySelectorAll('[data-block]').forEach(b=>b.onclick=()=>setAccess(b.dataset.block,false));items.querySelectorAll('[data-allow]').forEach(b=>b.onclick=()=>setAccess(b.dataset.allow,true));items.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteMember(b.dataset.delete))}catch(e){msg(secMsg,e.message)}}
function dayLabel(v){return ({terca:'TERÇA • DOUTRINA',quinta:'QUINTA • VITÓRIA',sabado:'SÁBADO',domingo:'DOMINGO'})[v]||String(v||'').toUpperCase()}async function openSongs(){let schedules=[];try{schedules=await req('/rest/v1/ieadjo_schedules?select=id,event_date,title&order=event_date.asc')}catch{}work.innerHTML=`<h3>Repertório por culto</h3><div class="inline"><input id="songTitle" placeholder="Música"><input id="songKey" placeholder="Tom"><select id="songDay"><option value="terca">Terça — Doutrina</option><option value="quinta">Quinta — Vitória</option><option value="sabado">Sábado</option><option value="domingo">Domingo</option></select><select id="songSchedule"><option value="">Todos os cultos desse tipo</option>${schedules.map(s=>`<option value="${s.id}">${esc(s.event_date)} — ${esc(s.title)}</option>`).join('')}</select><input id="songNotes" placeholder="Observações"><button id="saveSong" class="btn primary">Adicionar</button></div><div id="secMsg" class="msg"></div><div id="items" class="list"></div>`;saveSong.onclick=addSong;loadSongs()}async function addSong(){try{await req('/rest/v1/ieadjo_songs',{method:'POST',body:JSON.stringify({title:songTitle.value.trim(),song_key:songKey.value.trim(),service_day:songDay.value,schedule_id:songSchedule.value?Number(songSchedule.value):null,notes:songNotes.value.trim()})});loadSongs()}catch(e){msg(secMsg,e.message)}}async function loadSongs(){try{const r=await req('/rest/v1/ieadjo_songs?select=*&order=created_at.desc');items.innerHTML=r.map(x=>`<div class="item"><div><b>${esc(x.title)} <span class="status">${esc(dayLabel(x.service_day))}</span></b><small>Tom: ${esc(x.song_key||'-')}${x.notes?' • '+esc(x.notes):''}</small></div><button class="btn danger" data-song="${x.id}">Remover</button></div>`).join('')||'<small>Nenhuma música.</small>';items.querySelectorAll('[data-song]').forEach(b=>b.onclick=async()=>{await req('/rest/v1/ieadjo_songs?id=eq.'+b.dataset.song,{method:'DELETE'});loadSongs()})}catch(e){msg(secMsg,e.message)}}
document.querySelectorAll('.tile').forEach(b=>b.onclick=()=>openSec(b.dataset.sec));login.onclick=doLogin;signup.onclick=doSignup;addLeader.onclick=addLeaderFn;logout.onclick=()=>{clear();location.reload()};setInterval(()=>{if(!dashboard.classList.contains('hidden'))refreshBadge()},15000);enter();
</script></body></html>
