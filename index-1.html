<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e2a47">
<link rel="manifest" href="/manifest.webmanifest">
<title>IEADJO Nova Joinville</title>
<style>
:root{--navy:#0e2a47;--blue:#174f7c;--gold:#d5ad58;--bg:#f5f7fa;--text:#152433;--muted:#6c7a89;--line:#e5eaf0;--green:#238b57}*{box-sizing:border-box}body{margin:0;background:#e9eef3;color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.app{max-width:520px;min-height:100vh;margin:auto;background:var(--bg);padding-bottom:88px}.top{height:74px;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,var(--navy),#153b60);color:#fff;position:sticky;top:0;z-index:5}.brand{display:flex;gap:10px;align-items:center}.mark{width:50px;height:50px;border:2px solid #d5ad58;border-radius:50%;overflow:hidden;flex:0 0 50px;box-shadow:0 0 0 2px #ffffff22}.mark img{width:100%;height:100%;object-fit:cover;display:block}.brand div:last-child{display:flex;flex-direction:column}.brand strong{letter-spacing:1px;font-size:18px}.brand small{letter-spacing:1.7px;opacity:.8;font-size:10px}.avatar{width:40px;height:40px;border:0;border-radius:50%;background:var(--gold);font-weight:800;color:var(--navy);overflow:hidden;padding:0}.avatar img{width:100%;height:100%;object-fit:cover}main{padding:20px 16px}.hello p{margin:0;color:var(--blue);font-weight:700}.hello h1{margin:4px 0 2px;font-size:25px}.hello span,.muted{font-size:13px;color:var(--muted)}.hero{margin-top:18px;background:linear-gradient(145deg,var(--navy),#17496f);color:#fff;border-radius:22px;padding:18px;box-shadow:0 12px 30px #0e2a4722}.herohead{display:flex;justify-content:space-between;font-size:12px;opacity:.9}.pill{display:inline-block;background:#d5ad5826;color:#f3d38b;border:1px solid #d5ad5860;border-radius:99px;padding:5px 9px;font-size:10px;font-weight:800}.hero h2{margin:14px 0 3px}.hero .muted{color:#ffffffaa}.role{display:flex;gap:10px;align-items:center;margin:16px 0;background:#ffffff10;padding:11px;border-radius:14px}.role span{font-size:23px}.role small,.role b{display:block}.actions{display:flex;gap:8px}.actions button{flex:1;border:0;border-radius:12px;padding:11px 8px;font-weight:750}.primary{background:var(--gold);color:var(--navy)}.success{background:#54c388;color:#073c24}.secondary{background:#ffffff14;color:#fff;border:1px solid #ffffff25!important}.section-title{margin:22px 2px 10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid button{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;text-align:left;display:grid;grid-template-columns:36px 1fr;grid-template-rows:auto auto}.grid button .ico{grid-row:1/3;font-size:22px}.grid b{font-size:14px}.grid small{color:var(--muted);margin-top:2px}.notice,.card,.song,.setting,.editcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:10px}.notice{display:flex;gap:12px;background:#fff8e8;border-color:#f1dcaa}.notice p{font-size:12px;color:#6f6042;line-height:1.45;margin:3px 0}.pagehead h1{margin:0;font-size:25px}.pagehead p{margin:4px 0 18px;color:var(--muted);font-size:13px}.card,.song,.setting{display:flex;gap:12px;align-items:center}.date{width:48px;height:50px;border-radius:12px;background:#eef4f9;color:var(--blue);display:flex;flex-direction:column;justify-content:center;align-items:center;font-weight:800}.date small{font-size:10px}.grow{flex:1;display:flex;flex-direction:column}.grow b{font-size:14px}.grow span{font-size:12px;color:var(--muted)}.status{font-size:10px;padding:6px 8px;border-radius:99px;background:#fff4df;color:#9a6913}.status.ok{background:#e7f7ef;color:#26764d}.calendar{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px}.calhead{display:flex;justify-content:space-between;padding-bottom:15px}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.week span{font-size:10px;color:var(--muted)}.days span{aspect-ratio:1;display:grid;place-items:center;font-size:12px;border-radius:50%}.days .event{background:var(--navy);color:#fff;box-shadow:inset 0 -3px var(--gold)}.song .icon{width:42px;height:42px;border-radius:12px;background:#eef4f9;display:grid;place-items:center;font-size:22px;color:var(--blue)}.song button,.admin button,.composer button,.savebtn,.photoBtn{border:0;border-radius:10px;background:var(--navy);color:#fff;padding:10px 12px;font-size:12px;font-weight:800}.post{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px;margin-bottom:12px}.post h3{margin:10px 0 7px}.post p{font-size:13px;color:#566675;line-height:1.55}.chat{min-height:400px}.bubble{max-width:86%;background:#fff;border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:10px 12px;margin-bottom:10px}.bubble.mine{margin-left:auto;background:#e6f0f8;border-radius:16px 16px 4px 16px}.bubble b{font-size:11px;color:var(--blue)}.bubble p{margin:4px 0;font-size:13px}.bubble small{display:block;text-align:right;color:var(--muted);font-size:9px}.composer{display:flex;gap:8px;position:sticky;bottom:74px;background:var(--bg);padding:10px 0}.composer input{flex:1;border:1px solid var(--line);border-radius:12px;padding:12px}.profile{text-align:center;padding:8px}.bigavatar{width:92px;height:92px;margin:auto;background:var(--gold);border-radius:50%;display:grid;place-items:center;font-size:30px;font-weight:800;color:var(--navy);overflow:hidden;border:4px solid #fff;box-shadow:0 5px 20px #0e2a4724}.bigavatar img{width:100%;height:100%;object-fit:cover}.photoRow{display:flex;justify-content:center;margin-top:10px}.photoBtn{cursor:pointer;background:#eef4f9;color:var(--navy)}.photoInput{display:none}.profile h2{margin:10px 0 2px}.profile p{margin:0;color:var(--muted);font-size:13px}.setting{justify-content:space-between}.setting div{display:flex;flex-direction:column}.setting span{font-size:11px;color:var(--muted)}.toggle{width:44px;height:25px;border:0;border-radius:99px;background:#cbd4dc;padding:3px}.toggle i{display:block;width:19px;height:19px;border-radius:50%;background:#fff;transition:.2s}.toggle.on{background:var(--green)}.toggle.on i{transform:translateX(19px)}.editcard h3{margin:0 0 12px}.field{margin:11px 0}.field label{display:block;font-size:11px;font-weight:800;color:#4f6170;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px;background:#fff;font:inherit;color:var(--text)}.field textarea{min-height:80px;resize:vertical}.savebtn{width:100%;padding:13px;margin-top:5px}.saved{font-size:12px;color:var(--green);text-align:center;margin-top:8px;min-height:17px}.admin{background:#fff7e8;border:1px solid #ead8ae;border-radius:18px;padding:16px;margin-top:12px}.admin p{font-size:12px;color:#766548}.admin button{width:100%}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:72px;background:#fff;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);z-index:10}.nav button{border:0;background:none;color:#8b98a5;display:flex;flex-direction:column;align-items:center;justify-content:center}.nav button span{font-size:21px}.nav button small{font-size:10px}.nav button.active{color:var(--navy);font-weight:800}@media(min-width:700px){.app{margin-top:20px;min-height:calc(100vh - 40px);border-radius:24px;overflow:hidden}.nav{bottom:20px;border-radius:0 0 24px 24px}}
</style>
</head>
<body>
<div class="app"><header class="top"><div class="brand"><div class="mark"><img src="/igreja-hq.jpg" alt="IEADJO Nova Joinville"></div><div><strong>IEADJO</strong><small>NOVA JOINVILLE</small></div></div><button class="avatar" id="topAvatar" data-go="perfil"></button></header><main id="view"></main><nav class="nav"><button data-go="inicio" class="active"><span>⌂</span><small>Início</small></button><button data-go="escalas"><span>☷</span><small>Escalas</small></button><button data-go="calendario"><span>□</span><small>Agenda</small></button><button data-go="chat"><span>◌</span><small>Chat</small></button><button data-go="perfil"><span>♙</span><small>Perfil</small></button></nav></div>
<script>
const schedules=[['23','AGO','Culto de Celebração','19:00 • Equipe','Confirmado'],['26','AGO','Ensaio do Louvor','20:00 • Equipe completa','Pendente'],['30','AGO','Culto da Família','19:00 • Equipe','Pendente']];
const songs=[['Bondade de Deus','G','Domingo'],['Lugar Secreto','D','Domingo'],['A Casa É Sua','E','Domingo'],['Me Atraiu','A','Ensaio']];
let confirmed=localStorage.getItem('confirmed')==='1';let available=localStorage.getItem('available')!=='0';let messages=JSON.parse(localStorage.getItem('chat')||'null')||[{name:'Pr. Lucas',msg:'Pessoal, ensaio quarta às 20h. Deus abençoe!',time:'11:42'},{name:'Mariana',msg:'Confirmado 🙏',time:'11:50'}];
let profile=JSON.parse(localStorage.getItem('ieadjo_member_profile')||'null')||{name:'Integrante',role:'Membro do grupo',phone:'',bio:'',photo:''};
let tab='inicio';const view=document.querySelector('#view');
function esc(v){return String(v||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function initials(){const n=(profile.name||'Integrante').trim().split(/\s+/);return ((n[0]?.[0]||'I')+(n.length>1?(n[n.length-1][0]||''):'')).toUpperCase()}
function avatarMarkup(){return profile.photo?`<img src="${profile.photo}" alt="Foto de ${esc(profile.name)}">`:esc(initials())}
function refreshTopAvatar(){document.getElementById('topAvatar').innerHTML=avatarMarkup()}
function page(title,sub,body){return `<div class="pagehead"><h1>${title}</h1><p>${sub}</p></div>${body}`}
function render(){document.querySelectorAll('[data-go]').forEach(b=>b.classList.toggle('active',b.dataset.go===tab));refreshTopAvatar();
if(tab==='inicio')view.innerHTML=`<div class="hello"><p>Olá, ${esc(profile.name)} 👋</p><h1>Ministério de Louvor</h1><span>Organização, comunhão e serviço em um só lugar.</span></div><div class="hero"><div class="herohead"><span class="pill">PRÓXIMA ESCALA</span><span>Dom • 23 ago</span></div><h2>Culto de Celebração</h2><p class="muted">19:00 • Templo IEADJO Nova Joinville</p><div class="role"><span>🙌</span><div><small>Sua função</small><b>${esc(profile.role||'Membro do grupo')}</b></div></div><div class="actions"><button id="confirm" class="${confirmed?'success':'primary'}">${confirmed?'✓ Presença confirmada':'Confirmar presença'}</button><button class="secondary" id="cant">Não posso ir</button></div></div><div class="section-title"><h3>Acesso rápido</h3></div><div class="grid">${[['📋','Escalas','3 próximas','escalas'],['📅','Calendário','Agosto 2026','calendario'],['🎵','Repertório','4 músicas','repertorio'],['📢','Avisos','2 novos','avisos'],['💬','Chat geral','Todos','chat'],['👤','Meu perfil','Editar dados e foto','perfil']].map(x=>`<button data-go="${x[3]}"><span class="ico">${x[0]}</span><b>${x[1]}</b><small>${x[2]}</small></button>`).join('')}</div><div class="notice"><div>📌</div><div><b>Aviso da liderança</b><p>Ensaio geral nesta quarta-feira às 20h. Chegar 15 minutos antes.</p></div></div>`;
if(tab==='escalas')view.innerHTML=page('Minhas escalas','Confirme sua participação e veja suas funções.',schedules.map(s=>`<div class="card"><div class="date">${s[0]}<small>${s[1]}</small></div><div class="grow"><b>${s[2]}</b><span>${s[3]}</span></div><span class="status ${s[4]==='Confirmado'?'ok':''}">${s[4]}</span></div>`).join(''));
if(tab==='calendario'){let ds='';for(let i=0;i<35;i++){let d=i-5;ds+=`<span class="${[23,26,30].includes(d)?'event':''}">${d>0&&d<=31?d:''}</span>`}view.innerHTML=page('Calendário','Cultos, ensaios e eventos do ministério.',`<div class="calendar"><div class="calhead"><b>Agosto 2026</b><span>‹ &nbsp; ›</span></div><div class="week"><span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span></div><div class="days">${ds}</div></div>`)}
if(tab==='repertorio')view.innerHTML=page('Repertório','Músicas da semana, tons e materiais.',songs.map(s=>`<div class="song"><div class="icon">♫</div><div class="grow"><b>${s[0]}</b><span>Tom: ${s[1]} • ${s[2]}</span></div><button onclick="window.open('https://www.cifraclub.com.br/search/?q=${encodeURIComponent(s[0])}','_blank','noopener')">Abrir no Cifra Club</button></div>`).join(''));
if(tab==='avisos')view.innerHTML=page('Mural de avisos','Comunicados oficiais da liderança.',`<article class="post"><span class="pill">IMPORTANTE</span><h3>Ensaio geral — quarta-feira</h3><p>Começaremos às 20h. Pedimos que todos cheguem 15 minutos antes para organização dos instrumentos e passagem de som.</p><small>Hoje • Liderança do Louvor</small></article><article class="post"><h3>Repertório de domingo atualizado</h3><p>As músicas e os tons já estão disponíveis na área de repertório.</p><small>Ontem • Ministério de Louvor</small></article>`);
if(tab==='chat')view.innerHTML=page('Chat geral','Espaço de conversa para todos os integrantes.',`<div class="chat">${messages.map(m=>`<div class="bubble ${m.name==='Você'?'mine':''}"><b>${m.name}</b><p>${m.msg}</p><small>${m.time}</small></div>`).join('')}</div><div class="composer"><input id="msg" placeholder="Escreva uma mensagem..."><button id="send">Enviar</button></div>`);
if(tab==='perfil')view.innerHTML=page('Meu perfil','Edite seus dados, função e foto.',`<div class="profile"><div class="bigavatar">${avatarMarkup()}</div><div class="photoRow"><label class="photoBtn" for="photoInput">📷 Alterar foto</label><input class="photoInput" id="photoInput" type="file" accept="image/*"></div><h2>${esc(profile.name)}</h2><p>${esc(profile.role||'Membro do grupo')}</p></div><div class="setting"><div><b>Disponível para escalas</b><span>Você pode alterar quando precisar.</span></div><button id="toggle" class="toggle ${available?'on':''}"><i></i></button></div><div class="editcard"><h3>Editar perfil</h3><div class="field"><label>Nome completo</label><input id="pName" value="${esc(profile.name)}" placeholder="Seu nome"></div><div class="field"><label>Função / instrumento</label><input id="pRole" value="${esc(profile.role)}" placeholder="Ex.: Vocal, Bateria, Teclado"></div><div class="field"><label>Telefone</label><input id="pPhone" value="${esc(profile.phone)}" placeholder="(47) 99999-9999" inputmode="tel"></div><div class="field"><label>Sobre você</label><textarea id="pBio" placeholder="Escreva uma breve apresentação">${esc(profile.bio)}</textarea></div><button class="savebtn" id="saveProfile">Salvar alterações</button><div class="saved" id="savedMsg"></div></div><div class="admin"><b>Área da liderança</b><p>Acesso exclusivo para líderes autorizados.</p><button id="adminGo">Entrar no painel administrativo</button></div>`);bind()}
function saveProfile(){profile.name=(document.getElementById('pName').value||'Integrante').trim();profile.role=(document.getElementById('pRole').value||'Membro do grupo').trim();profile.phone=document.getElementById('pPhone').value.trim();profile.bio=document.getElementById('pBio').value.trim();localStorage.setItem('ieadjo_member_profile',JSON.stringify(profile));document.getElementById('savedMsg').textContent='✓ Perfil atualizado';refreshTopAvatar();setTimeout(render,650)}
function resizePhoto(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onerror=reject;r.onload=()=>{const img=new Image();img.onload=()=>{const max=480,scale=Math.min(1,max/Math.max(img.width,img.height)),w=Math.round(img.width*scale),h=Math.round(img.height*scale),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);resolve(c.toDataURL('image/jpeg',.82))};img.onerror=reject;img.src=r.result};r.readAsDataURL(file)})}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{tab=b.dataset.go;render()});let c=document.querySelector('#confirm');if(c)c.onclick=()=>{confirmed=true;localStorage.setItem('confirmed','1');render()};let no=document.querySelector('#cant');if(no)no.onclick=()=>{available=false;localStorage.setItem('available','0');tab='perfil';render()};let t=document.querySelector('#toggle');if(t)t.onclick=()=>{available=!available;localStorage.setItem('available',available?'1':'0');render()};let s=document.querySelector('#send');if(s)s.onclick=()=>{let i=document.querySelector('#msg');if(!i.value.trim())return;messages.push({name:'Você',msg:i.value.trim(),time:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})});localStorage.setItem('chat',JSON.stringify(messages));render()};let sp=document.getElementById('saveProfile');if(sp)sp.onclick=saveProfile;let pi=document.getElementById('photoInput');if(pi)pi.onchange=async()=>{const f=pi.files&&pi.files[0];if(!f)return;try{profile.photo=await resizePhoto(f);localStorage.setItem('ieadjo_member_profile',JSON.stringify(profile));render()}catch(e){alert('Não foi possível carregar esta foto. Tente outra imagem.')}};let ag=document.getElementById('adminGo');if(ag)ag.onclick=()=>location.href='/admin/'}
refreshTopAvatar();render();
</script>
</body>
</html>
