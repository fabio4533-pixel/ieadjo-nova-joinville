<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0e2a47"><link rel="manifest" href="/manifest.webmanifest"><title>IEADJO Nova Joinville</title><style>

fff14;color:#fff;border:1px solid #ffffff25!important}.section-title{margin:22px 2px 10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid button{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;text-align:left;display:grid;grid-template-columns:36px 1fr;grid-template-rows:auto auto}.grid button .ico{grid-row:1/3;font-size:22px}.grid small{color:var(--muted)}.notice,.card,.song,.setting,.editcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:10px}.notice{display:flex;gap:12px;background:#fff8e8}.pagehead h1{margin:0;font-size:25px}.pagehead p{margin:4px 0 18px;color:var(--muted);font-size:13px}.card,.song,.setting{display:flex;gap:12px;align-items:center}.date{width:48px;height:50px;border-radius:12px;background:#eef4f9;color:var(--blue);display:flex;flex-direction:column;justify-content:center;align-items:center;font-weight:800}.date small{font-size:10px}.grow{flex:1;display:flex;flex-direction:column}.grow b{font-size:14px}.grow span{font-size:12px;color:var(--muted)}.status{font-size:10px;padding:6px 8px;border-radius:99px;background:#fff4df;color:#9a6913}.calendar{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px}.calhead{display:flex;justify-content:space-between;padding-bottom:15px}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.week span{font-size:10px;color:var(--muted)}.days span{aspect-ratio:1;display:grid;place-items:center;font-size:12px;border-radius:50%}.days .event{background:var(--navy);color:#fff;box-shadow:inset 0 -3px var(--gold)}.song .icon{width:42px;height:42px;border-radius:12px;background:#eef4f9;display:grid;place-items:center;font-size:22px}.song button,.composer button,.savebtn,.admin button{border:0;border-radius:10px;background:var(--navy);color:#fff;padding:10px 12px;font-size:12px;font-weight:800}.chat{min-height:380px;padding-bottom:8px}.bubble{max-width:86%;background:#fff;border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:10px 12px;margin-bottom:10px}.bubble.mine{margin-left:auto;background:#e6f0f8;border-radius:16px 16px 4px 16px}.bubble b{font-size:11px;color:var(--blue)}.bubble p{margin:4px 0;font-size:13px;white-space:pre-wrap;word-break:break-word}.bubble small{display:block;text-align:right;color:var(--muted);font-size:9px}.composer{display:flex;gap:8px;position:sticky;bottom:74px;background:var(--bg);padding:10px 0}.composer input{flex:1;border:1px solid var(--line);border-radius:12px;padding:12px}.chatstate{text-align:center;color:var(--muted);font-size:12px;padding:20px}.profile{text-align:center}.bigavatar{width:92px;height:92px;margin:auto;background:var(--gold);border-radius:50%;display:grid;place-items:center;font-size:30px;font-weight:800;color:var(--navy);overflow:hidden}.bigavatar img{width:100%;height:100%;object-fit:cover}.field{margin:11px 0}.field label{display:block;font-size:11px;font-weight:800;margin-bottom:5px}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px;font:inherit}.savebtn{width:100%;padding:13px}.admin{background:#fff7e8;border:1px solid #ead8ae;border-radius:18px;padding:16px;margin-top:12px}.admin button{width:100%}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:72px;background:#fff;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);z-index:10}.nav button{border:0;background:none;color:#8b98a5;display:flex;flex-direction:column;align-items:center;justify-content:center}.nav button span{font-size:21px}.nav button small{font-size:10px}.nav button.active{color:var(--navy);font-weight:800}@media(min-width:700px){.app{margin-top:20px;border-radius:24px;overflow:hidden}.nav{bottom:20px}}
</style></head><body><div class="app"><header class="top"><div class="brand"><div class="mark"><img src="/igreja-hq.jpg"></div><div><strong>IEADJO</strong><small>NOVA JOINVILLE</small></div></div><button class="avatar" id="topAvatar" data-go="perfil"></button></header><main id="view"></main><nav class="nav"><button data-go="inicio" class="active"><span>⌂</span><small>Início</small></button><button data-go="escalas"><span>☷</span><small>Escalas</small></button><button data-go="calendario"><span>□</span><small>Agenda</small></button><button data-go="chat"><span>◌</span><small>Chat</small></button><button data-go="perfil"><span>♙</span><small>Perfil</small></button></nav></div><script>
const SB_URL='https://fzpffyouubmbxfwycywg.supabase.co',SB_KEY='sb_publishable_fqG3I5cRWBXjn-EP0FoATA_0-SWvfsR';
const schedules=[['23','AGO','Culto de Celebração','19:00 • Equipe','Confirmado'],['26','AGO','Ensaio do Louvor','20:00 • Equipe completa','Pendente'],['30','AGO','Culto da Família','19:00 • Equipe','Pendente']];
const songs=[['Bondade de Deus','G','Domingo'],['Lugar Secreto','D','Domingo'],['A Casa É Sua','E','Domingo'],['Me Atraiu','A','Ensaio']];
let profile=JSON.parse(localStorage.getItem('ieadjo_member_profile')||'null')||{name:'Integrante',role:'Membro do grupo',phone:'',bio:'',photo:''},tab='inicio',chatMessages=[],chatBusy=false;const view=document.getElementById('view');
function session(){try{return JSON.parse(localStorage.getItem('ieadjo_member_session')||'null')}catch{return null}}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function initials(){const n=(profile.name||'Integrante').trim().split(/\s+/);return ((n[0]?.[0]||'I')+(n.length>1?n[n.length-1][0]:'')).toUpperCase()}
function avatarMarkup(){return profile.photo?`<img src="${profile.photo}" alt="Foto">`:esc(initials())}
function page(t,s,b){return `<div class="pagehead"><h1>${t}</h1><p>${s}</p></div>${b}`}
function api(path,o={}){const s=session(),h={'apikey':SB_KEY,'Content-Type':'application/json',...(o.headers||{})};if(s?.access_token)h.Authorization='Bearer '+s.access_token;return fetch(SB_URL+path,{...o,headers:h}).then(async r=>{let d=null;try{d=await r.json()}catch{}if(!r.ok)throw new Error(d?.message||d?.msg||'Erro no chat');return d})}
function fmtChatDate(v){const d=new Date(v),today=new Date(),same=d.toDateString()===today.toDateString();return same?d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}
async function loadChat(quiet=false){if(chatBusy)return;chatBusy=true;try{const rows=await api('/rest/v1/ieadjo_chat_messages?select=id,user_id,sender_name,message,created_at&order=created_at.asc&limit=300');chatMessages=rows||[];if(tab==='chat')renderChat()}catch(e){if(!quiet&&tab==='chat'){const el=document.getElementById('chatList');if(el)el.innerHTML='<div class="chatstate">Não foi possível carregar o chat.</div>'}}finally{chatBusy=false}}
async function sendChat(){const i=document.getElementById('msg'),s=session(),text=i?.value.trim();if(!text||!s?.user?.id)return;const b=document.getElementById('send');if(b)b.disabled=true;try{await api('/rest/v1/ieadjo_chat_messages',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({user_id:s.user.id,sender_name:profile.name||s.user.email||'Integrante',message:text})});i.value='';await loadChat(true)}catch(e){alert('Não foi possível enviar a mensagem.')}finally{if(b)b.disabled=false}}
function renderChat(){if(tab!=='chat')return;const s=session(),list=document.getElementById('chatList');if(!list)return;list.innerHTML=chatMessages.length?chatMessages.map(m=>`<div class="bubble ${m.user_id===s?.user?.id?'mine':''}"><b>${esc(m.sender_name)}</b><p>${esc(m.message)}</p><small>${esc(fmtChatDate(m.created_at))}</small></div>`).join(''):'<div class="chatstate">Ainda não há mensagens. Seja o primeiro a escrever.</div>';list.scrollTop=list.scrollHeight}
function render(){document.querySelectorAll('[data-go]').forEach(b=>b.classList.toggle('active',b.dataset.go===tab));topAvatar.innerHTML=avatarMarkup();
if(tab==='inicio')view.innerHTML=`<div class="hello"><p>Olá, ${esc(profile.name)} 👋</p><h1>Ministério de Louvor</h1><span>Organização, comunhão e serviço em um só lugar.</span></div><div class="hero"><div class="herohead"><span class="pill">PRÓXIMA ESCALA</span><span>Dom • 23 ago</span></div><h2>Culto de Celebração</h2><p class="muted">19:00 • Templo IEADJO Nova Joinville</p><div class="role"><span>🙌</span><div><small>Sua função</small><b>${esc(profile.role||'Membro do grupo')}</b></div></div><div class="actions"><button class="primary">Confirmar presença</button><button class="secondary">Não posso ir</button></div></div><div class="section-title"><h3>Acesso rápido</h3></div><div class="grid">${[['📋','Escalas','Próximas','escalas'],['📅','Calendário','Agenda','calendario'],['🎵','Repertório','Músicas','repertorio'],['📢','Avisos','Liderança','avisos'],['💬','Chat geral','Histórico online','chat'],['👤','Meu perfil','Editar dados','perfil']].map(x=>`<button data-go="${x[3]}"><span class="ico">${x[0]}</span><b>${x[1]}</b><small>${x[2]}</small></button>`).join('')}</div>`;
if(tab==='escalas')view.innerHTML=page('Minhas escalas','Cultos, integrantes e funções.',schedules.map(s=>`<div class="card"><div class="date">${s[0]}<small>${s[1]}</small></div><div class="grow"><b>${s[2]}</b><span>${s[3]}</span></div><span class="status">${s[4]}</span></div>`).join(''));
if(tab==='calendario'){let ds='';for(let i=0;i<35;i++){let d=i-5;ds+=`<span class="${[23,26,30].includes(d)?'event':''}">${d>0&&d<=31?d:''}</span>`}view.innerHTML=page('Calendário','Cultos, ensaios e eventos.',`<div class="calendar"><div class="calhead"><b>Agosto 2026</b><span>Dinâmico</span></div><div class="week"><span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span></div><div class="days">${ds}</div></div>`)}
if(tab==='repertorio')view.innerHTML=page('Repertório','Músicas, tons, cifras e letras.',songs.map(s=>`<div class="song"><div class="icon">♫</div><div class="grow"><b>${esc(s[0])}</b><span>Tom: ${esc(s[1])} • ${esc(s[2])}</span></div><button>Ver cifra</button></div>`).join(''));
if(tab==='avisos')view.innerHTML=page('Mural de avisos','Comunicados oficiais da liderança.',`<div class="notice"><div>📌</div><div><b>Aviso da liderança</b><p>Os comunicados serão exibidos aqui.</p></div></div>`);
if(tab==='chat'){view.innerHTML=page('Chat geral','Conversa compartilhada entre todos os integrantes. O histórico fica salvo.',`<div id="chatList" class="chat"><div class="chatstate">Carregando conversas...</div></div><div class="composer"><input id="msg" maxlength="1000" placeholder="Escreva uma mensagem..."><button id="send">Enviar</button></div>`);document.getElementById('send').onclick=sendChat;document.getElementById('msg').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat()}};loadChat(true)}
if(tab==='perfil')view.innerHTML=page('Meu perfil','Edite seus dados e foto.',`<div class="profile"><div class="bigavatar">${avatarMarkup()}</div><h2>${esc(profile.name)}</h2><p>${esc(profile.role||'Membro do grupo')}</p></div><div class="editcard"><div class="field"><label>Nome completo</label><input id="pName" value="${esc(profile.name)}"></div><div class="field"><label>Função / instrumento</label><input id="pRole" value="${esc(profile.role)}"></div><div class="field"><label>Telefone</label><input id="pPhone" value="${esc(profile.phone)}"></div><div class="field"><label>Sobre você</label><textarea id="pBio">${esc(profile.bio)}</textarea></div><button class="savebtn" id="saveProfile">Salvar alterações</button></div><div class="admin"><b>Área da liderança</b><p>Acesso exclusivo para líderes autorizados.</p><button id="adminGo">Entrar no painel administrativo</button></div>`);saveProfile.onclick=()=>{profile.name=pName.value.trim()||'Integrante';profile.role=pRole.value.trim()||'Membro do grupo';profile.phone=pPhone.value.trim();profile.bio=pBio.value.trim();localStorage.setItem('ieadjo_member_profile',JSON.stringify(profile));render()};adminGo.onclick=()=>location.href='/admin/'}
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{tab=b.dataset.go;render()})}
setInterval(()=>{if(tab==='chat')loadChat(true)},3000);window.addEventListener('focus',()=>{if(tab==='chat')loadChat(true)});render();
</script></body></html>
